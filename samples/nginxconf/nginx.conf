user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    access_log /var/log/nginx/access.log combined;

    upstream explorer_backend {
        least_conn;
        server 127.0.0.1:8080 weight=3;
        server 127.0.0.1:8081;
        server 127.0.0.1:8082 backup;
    }

    upstream explorer_search {
        server 127.0.0.1:9200;
    }

    # Everything on plain HTTP goes to the encrypted site.
    server {
        listen 80;
        listen [::]:80;
        server_name explorer.example.com www.explorer.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name explorer.example.com;

        ssl_certificate /etc/ssl/certs/explorer.example.com.crt;
        ssl_certificate_key /etc/ssl/private/explorer.example.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        access_log /var/log/nginx/explorer.access.log combined;

        location / {
            proxy_pass http://explorer_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /search/ {
            proxy_pass http://explorer_search;
        }

        location /static/ {
            root /srv/explorer;
            expires 30d;
        }

        location = /health {
            return 200 "ok";
        }
    }

    # Internal only, and never given a certificate.
    server {
        listen 8080;
        server_name metrics.internal;

        location /metrics {
            proxy_pass http://127.0.0.1:9090;
        }
    }
}
