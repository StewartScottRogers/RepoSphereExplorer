# Messages for the English locale.
! The second comment style, which Java reads exactly the same way.

app.name = Repos Explorer
app.version = 0.6.0

# A value that continues across three physical lines.
app.description = A front door to the local working directories \
  that source control systems check code out into, \
  developed as a dark factory.

# Outside Latin-1, so the file carries the escape Java's reader resolves.
greeting.morning = Bonjour, caf\u00e9
greeting.evening = Guten Abend, Stra\u00dfe

# Read as the empty string, not as absent - which is the whole difference.
banner.text =

# The colon separator, which is equally legal.
error.notFound: Nothing here by that name

# The whitespace separator, which is legal and nobody uses on purpose.
error.denied You are not allowed to do that
