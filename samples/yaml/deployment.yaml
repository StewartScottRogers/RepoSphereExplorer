# A multi-document stream, written to exercise every field the YAML
# plugin extracts: several documents, an anchor, an alias, a merge key, an
# explicit tag, a sequence document, block and flow styles, and a
# multi-line scalar.
---
defaults: &defaults
  replicas: 2
  restartPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 512Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repo-sphere
  labels:
    app: repo-sphere
    tier: backend
spec:
  <<: *defaults
  selector:
    matchLabels:
      app: repo-sphere
  template:
    spec:
      containers:
        - name: app
          image: repo-sphere/app:1.4.0
          ports: [8080, 9090]
          env:
            - name: RUST_LOG
              value: info
      startedAt: !!timestamp 2026-09-09T06:00:00Z
      notes: |
        A multi-line scalar, kept as written.
        The second line is part of the same value.
      summary: >
        A folded scalar, which joins its lines
        into one on the way out.

---
- first item of a sequence document
- second item
- third item
