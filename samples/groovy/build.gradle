plugins {
    id 'groovy'
    id 'codenarc'
}

group = 'com.example'
version = '0.7.1'
description = 'Turns build results into a report somebody can read.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy:4.0.26'

    testImplementation platform('org.spockframework:spock-bom:2.4-M6-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
}

codenarc {
    toolVersion = '3.6.0'
    // Reports are advisory here; the build fails on compilation, not style.
    ignoreFailures = true
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
