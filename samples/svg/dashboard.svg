<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="480" height="280" viewBox="0 0 480 280"
     role="img" aria-labelledby="title desc">
  <title id="title">Build throughput, last seven days</title>
  <desc id="desc">A small dashboard card with a bar chart, a sparkline and a legend.</desc>

  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c9be8"/>
      <stop offset="100%" stop-color="#0061b5"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f5f9"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.18"/>
    </filter>

    <clipPath id="plot">
      <rect x="40" y="40" width="400" height="150"/>
    </clipPath>

    <g id="tick">
      <line x1="0" y1="0" x2="400" y2="0" stroke="#dde3ea" stroke-width="1"/>
    </g>
  </defs>

  <rect x="0" y="0" width="480" height="280" rx="8" fill="url(#card)" filter="url(#shadow)"/>

  <text x="24" y="28" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f2933">
    Build throughput
  </text>
  <text x="456" y="28" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#6b7280">
    7 days
  </text>

  <g transform="translate(40, 40)">
    <use xlink:href="#tick" y="0"/>
    <use xlink:href="#tick" y="50"/>
    <use xlink:href="#tick" y="100"/>
    <use xlink:href="#tick" y="150"/>
  </g>

  <g clip-path="url(#plot)">
    <g fill="url(#bar)">
      <rect x="56"  y="120" width="34" height="70"  rx="2"/>
      <rect x="106" y="96"  width="34" height="94"  rx="2"/>
      <rect x="156" y="140" width="34" height="50"  rx="2"/>
      <rect x="206" y="70"  width="34" height="120" rx="2"/>
      <rect x="256" y="104" width="34" height="86"  rx="2"/>
      <rect x="306" y="58"  width="34" height="132" rx="2"/>
      <rect x="356" y="88"  width="34" height="102" rx="2"/>
    </g>

    <polyline points="73,110 123,86 173,130 223,60 273,94 323,48 373,78"
              fill="none" stroke="#c0392b" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round"
              stroke-dasharray="4 3"/>

    <circle cx="323" cy="48" r="4" fill="#c0392b"/>
  </g>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="73"  y="206">Mon</text>
    <text x="123" y="206">Tue</text>
    <text x="173" y="206">Wed</text>
    <text x="223" y="206">Thu</text>
    <text x="273" y="206">Fri</text>
    <text x="323" y="206">Sat</text>
    <text x="373" y="206">Sun</text>
  </g>

  <g transform="translate(40, 232)" font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <rect x="0" y="-9" width="12" height="12" rx="2" fill="url(#bar)"/>
    <text x="18" y="1" fill="#1f2933">Builds</text>

    <line x1="90" y1="-3" x2="112" y2="-3" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="118" y="1" fill="#1f2933">Median minutes</text>

    <path d="M 300 -4 l 6 -6 l 6 6 z" fill="#2e7d32"/>
    <text x="316" y="1" fill="#2e7d32">18% week on week</text>
  </g>
</svg>
