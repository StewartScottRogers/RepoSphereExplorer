[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "csvstats"
version = "0.9.2"
description = "Streaming summary statistics for delimited files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ada Lovelace", email = "ada@example.com" },
    { name = "Grace Hopper" },
]
keywords = ["csv", "statistics", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = ["click>=8.1", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11", "mypy>=1.15"]
docs = ["sphinx>=7.4", "furo>=2024.8"]

[project.scripts]
csvstats = "csvstats.cli:main"

[project.gui-scripts]
csvstats-viewer = "csvstats.gui:main"

[project.urls]
Homepage = "https://github.com/example/csvstats"
Issues = "https://github.com/example/csvstats/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/csvstats"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
