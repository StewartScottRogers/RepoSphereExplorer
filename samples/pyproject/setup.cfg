[metadata]
name = legacy-csvstats
version = 1.4.2
description = Streaming summary statistics for delimited files, packaged the setuptools way.
author = Ada Lovelace, Grace Hopper
license = MIT

[options]
python_requires = >=3.9
install_requires =
    click>=8.0
    requests>=2.25

[options.extras_require]
dev =
    pytest
    mypy
docs =
    sphinx

[options.entry_points]
console_scripts =
    legacy-csvstats = legacy_csvstats.cli:main
gui_scripts =
    legacy-csvstats-viewer = legacy_csvstats.gui:main
