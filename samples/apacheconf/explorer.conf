# Repos Explorer, served by Apache.

LoadModule rewrite_module modules/mod_rewrite.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ServerRoot "/etc/apache2"
Listen 80
Listen 443

<VirtualHost *:80>
    ServerName explorer.example.com
    ServerAlias www.explorer.example.com

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog /var/log/apache2/explorer.redirect.error.log
</VirtualHost>

<VirtualHost *:443>
    ServerName explorer.example.com
    ServerAlias www.explorer.example.com
    DocumentRoot /srv/explorer/public

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/explorer.example.com.crt
    SSLCertificateKeyFile /etc/ssl/private/explorer.example.com.key
    SSLCertificateChainFile /etc/ssl/certs/explorer-chain.pem

    ErrorLog /var/log/apache2/explorer.error.log
    CustomLog /var/log/apache2/explorer.access.log combined

    Header always set Strict-Transport-Security "max-age=63072000"

    <Directory /srv/explorer/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /srv/explorer/public/downloads>
        Options +Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Location /api>
        ProxyPass http://127.0.0.1:8080/api
        ProxyPassReverse http://127.0.0.1:8080/api
    </Location>

    <Files ".git*">
        Require all denied
    </Files>
</VirtualHost>
