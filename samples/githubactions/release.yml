name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the artefacts but publish nothing
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build the release binaries
        run: cargo build --release --locked
      - name: Sign them
        run: cargo run -p updater --bin sign_release
        env:
          SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: target/release/

  publish:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
      - name: Create the release
        run: gh release create "${GITHUB_REF_NAME}" ./binaries/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    runs-on: ubuntu-latest
    needs: [build, publish]
    uses: ./.github/workflows/pages.yml
