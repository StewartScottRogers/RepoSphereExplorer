; A service configuration in the loose INI dialect: keys before any
; section, both comment styles, quoted and bare values, and a repeated key
# that different readers resolve differently.

name = repo-sphere
enabled = yes

[server]
host = 0.0.0.0
port = 8080
tls_certificate = "/etc/repo-sphere/fullchain.pem"
tls_key = '/etc/repo-sphere/privkey.pem'
; the same key twice, which most readers take last-wins
workers = 4
workers = 8

[logging]
level = info
format = json
destination = /var/log/repo-sphere/app.log

[database]
url = postgres://app@localhost:5432/app
pool_size = 16
timeout_seconds = 30
