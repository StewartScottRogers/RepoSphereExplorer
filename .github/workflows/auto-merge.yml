name: Auto-merge

# Lights-out merging: enable auto-merge on PRs the factory is allowed to land
# on its own. GitHub still waits for the required checks defined in branch
# protection before merging.

# pull_request_target, not pull_request: workflows triggered by Dependabot's
# pull_request event get a read-only token, which cannot enable auto-merge.
# Nothing from the PR branch is checked out or executed here.
on:
  pull_request_target:
    types: [opened, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  # "Closes #N" auto-closing the linked issue on merge needs this - work-
  # order issues were staying open after their PR merged without it.
  issues: write

jobs:
  enable:
    if: >-
      github.actor == 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --squash --auto "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
