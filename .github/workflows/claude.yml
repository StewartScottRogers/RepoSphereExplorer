name: Claude

# The machine floor: Claude picks up work orders and answers @claude mentions.
# Requires the repository secret ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN).

on:
  issues:
    types: [opened, assigned, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One build at a time across the whole floor (this workflow and
# factory-shift.yml share the group): several work orders landing close
# together would otherwise run concurrently and repeatedly conflict on the
# same root Cargo.toml. Queue instead of cancelling, so no triggering issue
# or comment is silently dropped.
concurrency:
  group: dark-factory-floor
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: work-order
          claude_args: |
            --max-turns 30
