name: Claude

# The machine floor: Claude picks up work orders and answers @claude mentions.
# Requires CLAUDE_CODE_OAUTH_TOKEN (generate with `claude setup-token` on a
# Pro/Max subscription; a Console ANTHROPIC_API_KEY only works for
# workspace-scoped, non-identity-linked keys).

on:
  issues:
    types: [opened, assigned, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One build at a time across the whole floor (this workflow and
# factory-shift.yml), because several work orders landing close together
# would otherwise conflict on the same root Cargo.toml. That is kept by the
# "Wait for the floor to be free" step below, not by a concurrency group: a
# group holds only one *pending* run, so a fresh trigger cancels whatever was
# already pending rather than queueing behind it. A burst of twenty filed
# work orders cancelled nineteen of themselves, and the queued factory shift
# with them (#733). Every run now starts, and takes its turn in the step.

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  # Read-only: the wait step lists the floor's other runs to find out whether
  # any of them is older than this one.
  actions: read

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Before anything is installed or built, so a run that is waiting its
      # turn costs a runner and nothing else.
      - name: Wait for the floor to be free
        run: bash .github/wait-for-floor.sh
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
      # The same native libraries ci.yml installs before it builds. Without
      # them `gui` does not compile, so the agent cannot run the checks its
      # work order names: shift 35177959275 spent its 150 turns on
      # workarounds for a missing fontconfig and pushed nothing.
      - name: Install gui's native build dependencies (Slint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libfontconfig1-dev libx11-dev libxcb1-dev libx11-xcb-dev             libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev             libinput-dev libgbm-dev
      # The action installs the agent runtime itself, at a version hard-coded
      # inside it, and that install is intermittent: on 2026-09-08 the same
      # build 2.1.265 installed cleanly at 22:13 and, at 22:23, reported
      # "successfully installed" while leaving nothing at
      # /home/runner/.local/bin/claude - which the agent only discovered
      # after starting. Two re-runs failed the same way. See work order #298.
      #
      # So this installs the runtime, at a version this repository names,
      # and refuses to continue unless the binary is actually there and
      # runs. A station that cannot review is better than a station that
      # says nothing and leaves a red mark for somebody to notice.
      - name: Install the agent runtime
        id: agent-runtime
        env:
          # Bump deliberately, together with the other workflows that pin it.
          CLAUDE_CODE_VERSION: "2.1.265"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Installing Claude Code ${CLAUDE_CODE_VERSION}, attempt ${attempt}..."
            if curl -fsSL https://claude.ai/install.sh | bash -s -- "${CLAUDE_CODE_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::could not install the agent runtime after three attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

          # Where the installer is expected to leave it, then the places it
          # has been known to leave it instead. Finding it is better than
          # being right about where it should have been.
          binary=""
          for candidate in "${HOME}/.local/bin/claude" "${HOME}/.claude/bin/claude" "$(command -v claude || true)"; do
            if [ -n "${candidate}" ] && [ -x "${candidate}" ]; then
              binary="${candidate}"
              break
            fi
          done

          if [ -z "${binary}" ]; then
            echo "::error::the installer reported success but left no runnable binary (work order #298)"
            ls -la "${HOME}/.local/bin" "${HOME}/.claude/bin" 2>/dev/null || true
            exit 1
          fi

          "${binary}" --version
          echo "path=${binary}" >> "${GITHUB_OUTPUT}"

      - uses: anthropics/claude-code-action@v1
        # A command that runs past the agent runtime's two-minute default
        # is moved to the background, and an agent that then ends its turn
        # to wait is killed with the job. A clippy or test run over `gui`
        # takes longer than that: shift 35230067688 and #610's review both
        # died this way. Thirty minutes by default, an hour at most.
        env:
          BASH_DEFAULT_TIMEOUT_MS: "1800000"
          BASH_MAX_TIMEOUT_MS: "3600000"
        with:
          path_to_claude_code_executable: ${{ steps.agent-runtime.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: work-order
          claude_args: |
            --max-turns 100
            --allowedTools "Bash(git *),Bash(cargo *),Bash(gh *),Edit,Write,Read(//home/runner/.cargo/registry/**)"
            --disallowedTools "Bash(git push --force*),Bash(git push -f*),Bash(git reset --hard*),Bash(gh repo delete*)"
