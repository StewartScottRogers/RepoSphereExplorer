name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gui's native build dependencies (Slint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libx11-dev libxcb1-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev \
            libinput-dev libgbm-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo build --release

  coverage:
    name: coverage (informational, not a required check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gui's native build dependencies (Slint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libx11-dev libxcb1-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev \
            libinput-dev libgbm-dev
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --no-report
      - run: cargo llvm-cov report --summary-only
      - run: cargo llvm-cov report --html --output-dir coverage-html
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/*

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
