name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install gui's native build dependencies (Slint)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libx11-dev libxcb1-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev \
            libinput-dev libgbm-dev
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            ext=".exe"
          fi
          for bin in repo_sphere_explorer service RepoSphereExplorerTui RepoSphereExplorerGui verify; do
            cp "target/${{ matrix.target }}/release/${bin}${ext}" \
               "dist/${bin}-${{ matrix.target }}${ext}"
          done
          # The one-click Windows install (#560). Published under the name a
          # reader double-clicks, with no target triple after it: there is
          # one Windows build, and the file name is what they meet first.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/ReposExplorerSetup.exe" \
               "dist/ReposExplorerSetup.exe"
          fi

      # A Mac user does not install three Unix executables. They drag one icon
      # onto Applications, and what they drag is an application bundle: a
      # folder macOS reads as a program, with the icon, the name and the
      # version in its property list. `macos-bundle` builds that folder -
      # tested on every platform, because it is ordinary file work - and
      # `hdiutil` puts it in a disk image beside a shortcut to /Applications,
      # which is the one-drag convention.
      #
      # Unsigned, per DECISIONS.md D3: there is no Developer ID here, so
      # Gatekeeper stops a first double-click and the README says how to get
      # past it. Nothing in this step pretends otherwise.
      - name: Build the application bundle and its disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # macOS's own reader on the icon before anything is built around
          # it: iconutil refuses an icon set it cannot parse, and unpacks the
          # types it understood into a folder we can count. `cargo run -p
          # icon` wrote the file on a developer's machine, and this is what
          # says macOS agrees with it.
          iconutil --convert iconset --output "${RUNNER_TEMP}/icon.iconset" \
            assets/RepoSphereExplorer.icns
          ls -la "${RUNNER_TEMP}/icon.iconset"

          staging="${RUNNER_TEMP}/disk-image"
          rm -rf "$staging"
          mkdir -p "$staging"
          cargo run -p macos-bundle -- \
            "target/${{ matrix.target }}/release" \
            assets/RepoSphereExplorer.icns \
            "$staging/Repos Explorer.app"
          plutil -lint "$staging/Repos Explorer.app/Contents/Info.plist"
          plutil -p "$staging/Repos Explorer.app/Contents/Info.plist"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Repos Explorer" -srcfolder "$staging" \
            -ov -format UDZO dist/ReposExplorer.dmg
          # The icon travels as a release file of its own as well, so that
          # scripts/install.sh can build the same bundle and hold the icon to
          # the same signature as everything else it places.
          cp assets/RepoSphereExplorer.icns "dist/AppIcon-${{ matrix.target }}.icns"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

      # The one-file Linux option: no install step, no script, no unpacking.
      # Its own artifact rather than another file in the target's, so the
      # install checks that read that directory are not handed a file they
      # know nothing about. `publish` merges every artifact, so it is
      # released alongside the binaries.
      - name: Package the one-file AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/appimage.sh --from-directory dist \
            --output appimage/ReposExplorer-x86_64.AppImage
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: appimage
          path: appimage/*

  # The signed manifest, made here rather than only on the Pages site, so
  # the release can be installed and verified before it is published, and
  # so every release carries the manifest that installs that tag.
  sign:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p updater --bin sign_release
      - name: Sign the release's manifest
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: |
          mkdir -p signed
          ./target/release/sign_release "${GITHUB_REF_NAME#v}" "${{ github.repository }}"             "${GITHUB_REF_NAME}" dist signed/manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: manifest
          path: signed/manifest.json

  # Install, run, update and uninstall the release on every platform it is
  # built for, from this run's own artifacts, before anybody can download it.
  distribution:
    needs: sign
    uses: ./.github/workflows/distribution.yml
    with:
      from-artifacts: true

  publish:
    needs: distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
