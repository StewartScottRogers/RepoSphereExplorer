name: Close linked work orders

# Closes the issues a pull request declared it closes, the moment that pull
# request merges.
#
# Three mechanisms, and it is worth being exact about which does what,
# because the first version of this file was wrong about it (#294).
#
# 1. GitHub's own auto-close, from the `Closes #N` in a pull request's
#    description. It fires when the merge is performed by a *user* token.
#    It does not fire for a merge performed with `GITHUB_TOKEN`, which is
#    what `auto-merge.yml` used until #294 gave it AUTO_MERGE_TOKEN.
# 2. This workflow, on the `closed` event. The same rule applies to the
#    trigger: GitHub starts no workflow run from an event caused by
#    `GITHUB_TOKEN`, so with the fallback token this never runs at all -
#    pull request #292 merged and produced no run of this file. With
#    AUTO_MERGE_TOKEN set it does run, a second or two after the merge, and
#    finds most issues already closed by mechanism 1. That is belt and
#    braces, which is the point: it also covers a pull request merged by
#    hand, and it can be pointed at one that slipped through.
# 3. `floor-health-check.yml`, on its schedule, as the backstop for
#    anything both of the above missed. It is the slowest - GitHub
#    throttles cron on a quiet repository, measured at two to five hours
#    against a thirty-minute schedule - and it is the one that has been
#    quietly carrying this repository.

on:
  pull_request_target:
    types: [closed]
  # So the same logic can be pointed at a pull request by hand - to prove it
  # works, or to mop up one that merged while this workflow was broken.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose linked issues should close
        required: true

# Nothing from the pull request branch is checked out or executed here, so
# `pull_request_target`'s write-capable token is not exposed to its code.
permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close every issue the pull request finishes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -eu

          merged=$(gh pr view "$PR" --repo "$REPO" --json mergedAt --jq '.mergedAt // empty')
          if [ -z "$merged" ]; then
            echo "PR #$PR was closed without merging: its work order stays open, to be picked up fresh."
            exit 0
          fi

          issues=$(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences \
            --jq '.closingIssuesReferences[].number')
          if [ -z "$issues" ]; then
            echo "PR #$PR declares no issue to close."
            exit 0
          fi

          for n in $issues; do
            state=$(gh issue view "$n" --repo "$REPO" --json state --jq '.state')
            if [ "$state" = "CLOSED" ]; then
              echo "Issue #$n is already closed - the sweep, or a person, got there first."
              continue
            fi
            echo "Closing issue #$n, finished by PR #$PR."
            gh issue close "$n" --repo "$REPO" \
              --comment "Closed by PR #$PR, merged into \`main\`."
          done
