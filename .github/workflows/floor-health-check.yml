name: Floor health check

# Every 30 minutes, two cleanup sweeps for the same underlying cause:
# "Closes #N" auto-close-on-merge doesn't reliably fire for this repo's
# bot-authored PRs, and neither does the pull_request-triggered CI check
# always actually start.
#
# 1. Unstick auto-merge PRs whose required CI check never started. GitHub
#    sometimes holds the run in `action_required` (needs approval) or,
#    less commonly, never creates one at all - either way auto-merge waits
#    forever on a check that's never coming. Running often means this
#    usually catches it while the PR can still merge normally; a PR that
#    conflicts with main is marked, given a sweep to be rebased, and only
#    then closed, so its issue rebuilds fresh (factory-shift already picks
#    up any issue with no open PR).
# 2. Close any open work-order issue whose linked PR already merged but
#    left it open. Found by hand once already (7 issues had silently sat
#    "open" despite being done, inflating the backlog count and risking a
#    future night shift redoing already-shipped work) - this keeps it from
#    quietly re-accumulating.
#
# Both are deterministic, so this is plain gh/bash - no need for an LLM
# agent to do lookup-and-branch work with clear conditions.
#
# Both sweeps have since been caught acting on an answer they had no right
# to trust, and both now check twice before doing anything irreversible.
# See GUIDANCE.md section 1, "A cleanup station never discards work on a
# first sighting".

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Unstick, mark or close auto-merge PRs with no working CI check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MARK: stale-conflict
        run: |
          set -u
          gh label create "$MARK" --repo "$REPO" --color d93f0b \
            --description "Conflicts with main; closed next sweep if it still does" \
            >/dev/null 2>&1 || true

          prs=$(gh pr list --repo "$REPO" --label auto-merge --state open --json number --jq '.[].number')
          if [ -z "$prs" ]; then
            echo "No open auto-merge PRs."
            exit 0
          fi

          for pr in $prs; do
            info=$(gh pr view "$pr" --repo "$REPO" --json headRefOid,headRefName,mergeable,labels)
            sha=$(echo "$info" | jq -r .headRefOid)
            branch=$(echo "$info" | jq -r .headRefName)
            mergeable=$(echo "$info" | jq -r .mergeable)
            marked=$(echo "$info" | jq -r --arg mark "$MARK" '[.labels[].name] | index($mark) // empty')

            if [ "$mergeable" = "CONFLICTING" ]; then
              # GitHub works `mergeable` out in the background, and for a
              # while after a push it still answers for the commit before
              # it. Six pull requests were closed on exactly that stale
              # answer (#435). So ask again, and believe it only if the head
              # has not moved and the answer has not changed.
              sleep 30
              second=$(gh pr view "$pr" --repo "$REPO" --json headRefOid,mergeable)
              still=$(echo "$second" | jq -r .mergeable)
              head_now=$(echo "$second" | jq -r .headRefOid)

              if [ "$head_now" = "$sha" ] && [ "$still" = "CONFLICTING" ]; then
                if [ -z "$marked" ]; then
                  echo "PR #$pr: conflicts with main - marking it, looking again next sweep."
                  gh pr edit "$pr" --repo "$REPO" --add-label "$MARK" || true
                  gh pr comment "$pr" --repo "$REPO" --body "This branch conflicts with current \`main\`. Rebase it before the next sweep, in half an hour, or the floor health check will close this pull request and the work order will be picked up fresh. The branch itself stays on the remote either way, so no work is lost."
                else
                  echo "PR #$pr: still conflicting a sweep later - closing, issue rebuilds fresh."
                  gh pr close "$pr" --repo "$REPO" --comment "Closing - still conflicting with current main a full sweep after being marked. The branch stays on the remote and the work order stays open, so nothing is lost (automated PR health check)."
                fi
                continue
              fi
              echo "PR #$pr: the conflict did not survive a second look, leaving it open."
            fi

            if [ "$mergeable" != "CONFLICTING" ] && [ -n "$marked" ]; then
              echo "PR #$pr: no longer conflicting, clearing the mark."
              gh pr edit "$pr" --repo "$REPO" --remove-label "$MARK" || true
            fi

            has_ci=$(gh api "repos/$REPO/commits/$sha/check-runs" --jq '[.check_runs[] | select(.name == "fmt / clippy / test")] | length')
            if [ "$has_ci" -gt 0 ]; then
              echo "PR #$pr: CI check already exists for $sha, nothing to do."
              continue
            fi

            echo "PR #$pr: no CI check found yet for $sha."
            held_run=$(gh run list --repo "$REPO" --workflow ci.yml --branch "$branch" --json databaseId,conclusion --jq '[.[] | select(.conclusion == "action_required")] | (.[0].databaseId // empty)')
            if [ -n "$held_run" ]; then
              echo "PR #$pr: approving held CI run $held_run."
              gh api "repos/$REPO/actions/runs/$held_run/approve" -X POST || true
            else
              echo "PR #$pr: dispatching CI fresh against $branch."
              gh workflow run ci.yml --repo "$REPO" --ref "$branch"
            fi
          done

      - name: Close work-order issues already resolved by a merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          issues=$(gh issue list --repo "$REPO" --label work-order --state open --limit 1000 --json number --jq '.[].number')
          for n in $issues; do
            pr=$(gh issue view "$n" --repo "$REPO" --json closedByPullRequestsReferences --jq '.closedByPullRequestsReferences[0].number // empty')
            if [ -z "$pr" ]; then
              continue
            fi
            # A linked pull request is not a finished one: it may still be
            # open, in which case closing its issue would say the work is
            # done while it is still being built.
            merged=$(gh pr view "$pr" --repo "$REPO" --json mergedAt --jq '.mergedAt // empty')
            if [ -z "$merged" ]; then
              echo "Issue #$n: PR #$pr is linked but not merged, leaving it open."
              continue
            fi
            # GitHub keeps the "closed by" link after an issue is reopened,
            # so this step used to shut a reopened work order again within
            # the half hour - four formats went missing from the backlog
            # that way, because the pull request that "closed" them had
            # built something else entirely. A reopen dated after the merge
            # is somebody saying the merge did not finish the job, and that
            # answer outranks the link.
            reopened=$(gh api "repos/$REPO/issues/$n/timeline" --paginate \
              --jq '.[] | select(.event == "reopened") | .created_at' | tail -1)
            if [ -n "$reopened" ] \
               && [ "$(date -u -d "$reopened" +%s)" -gt "$(date -u -d "$merged" +%s)" ]; then
              echo "Issue #$n: reopened $reopened, after PR #$pr merged $merged - leaving it open."
              continue
            fi
            echo "Issue #$n: already resolved by merged PR #$pr, closing."
            gh issue close "$n" --repo "$REPO" --comment "Closed by merged PR #$pr (automated floor health check)."
          done
