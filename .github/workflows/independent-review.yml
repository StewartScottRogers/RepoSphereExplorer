name: Independent review

# A second, separately-invoked agent re-verifies a work-order PR before it's
# eligible to merge, rather than trusting the building agent's own claims of
# a passing fmt/clippy/test run. Read-only: never edits code, opens a PR, or
# pushes a commit - it only inspects the diff and leaves a
# `gh pr review --approve` or `--request-changes`.
#
# This check - `independent review` - is required on `main`, alongside
# `fmt / clippy / test`. A pull request does not merge until this
# station has run and either left a review or said out loud that it has
# nothing to say. Work order #460.
#
# It was informational for a long time, and what that cost is not
# hypothetical: pull request #451 merged with this check red - the
# station said "not reviewed" and the merge went ahead. That is why the
# turn budget below is set to fit the job rather than trimmed to the
# cheapest thing that usually works (#452), and why standing aside is
# something this job says in a run that happened rather than by not
# running at all (#460).
#
# A run this station loses now blocks the line. The known way for that
# to happen is the agent runtime failing to install (#298), which is
# guarded and loud; the remedy is re-running the job, not merging past
# it.

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  # Needed for claude-code-action's OIDC-based token exchange with
  # CLAUDE_CODE_OAUTH_TOKEN, same as claude.yml/factory-shift.yml.
  id-token: write

jobs:
  review:
    # Named, because the other reviewer's job has the same id and a
    # check is addressed by name. Two contexts both called `review`
    # cannot be told apart in branch protection, and this one is
    # required. Work order #460.
    name: independent review
    runs-on: ubuntu-latest
    steps:
      # There are two pull requests this station has nothing to say
      # about, and it decides both here rather than by not running.
      #
      # One edits a workflow. This workflow is triggered by
      # `pull_request`, so GitHub runs the *branch's* copy of it, and a
      # branch must not be able to rewrite its own reviewer;
      # `workflow-review.yml` reviews those from the base branch instead,
      # and holds them when they do not pass. Work order #439.
      #
      # The other is a dependency bump, which nobody wrote and which the
      # dependency audit already covers.
      #
      # This used to be `if: github.actor != 'dependabot[bot]'` on the
      # job. A job that does not run reports the check as *skipped*, and
      # a required check is not satisfied by a skip - so the moment this
      # became required, every dependency bump would have waited forever.
      # Standing aside is something this station has to say out loud, in
      # a run that happened. Work order #460.
      - name: Say whether this one is ours
        id: hold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ "${ACTOR}" = "dependabot[bot]" ]; then
            echo "stand_aside=dependabot" >> "$GITHUB_OUTPUT"
            echo "Opened by dependabot: nobody wrote this, and the dependency"
            echo "audit already covers it. Nothing for this station to say."
          elif gh pr diff "$PR" --repo "$REPO" --name-only | grep -q '^[.]github/workflows/'; then
            echo "stand_aside=workflow" >> "$GITHUB_OUTPUT"
            echo "Edits .github/workflows/: workflow-review.yml reviews this one."
          else
            echo "stand_aside=" >> "$GITHUB_OUTPUT"
            echo "Ours; the reviewer can run."
          fi

      - uses: actions/checkout@v7
        if: steps.hold.outputs.stand_aside == ''
      - name: Install gui's native build dependencies (Slint)
        if: steps.hold.outputs.stand_aside == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libx11-dev libxcb1-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev \
            libinput-dev libgbm-dev
      # The action installs the agent runtime itself, at a version hard-coded
      # inside it, and that install is intermittent: on 2026-09-08 the same
      # build 2.1.265 installed cleanly at 22:13 and, at 22:23, reported
      # "successfully installed" while leaving nothing at
      # /home/runner/.local/bin/claude - which the agent only discovered
      # after starting. Two re-runs failed the same way. See work order #298.
      #
      # So this installs the runtime, at a version this repository names,
      # and refuses to continue unless the binary is actually there and
      # runs. A station that cannot review is better than a station that
      # says nothing and leaves a red mark for somebody to notice.
      - name: Install the agent runtime
        id: agent-runtime
        if: steps.hold.outputs.stand_aside == ''
        env:
          # Bump deliberately, together with the other workflows that pin it.
          CLAUDE_CODE_VERSION: "2.1.265"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Installing Claude Code ${CLAUDE_CODE_VERSION}, attempt ${attempt}..."
            if curl -fsSL https://claude.ai/install.sh | bash -s -- "${CLAUDE_CODE_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::could not install the agent runtime after three attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

          # Where the installer is expected to leave it, then the places it
          # has been known to leave it instead. Finding it is better than
          # being right about where it should have been.
          binary=""
          for candidate in "${HOME}/.local/bin/claude" "${HOME}/.claude/bin/claude" "$(command -v claude || true)"; do
            if [ -n "${candidate}" ] && [ -x "${candidate}" ]; then
              binary="${candidate}"
              break
            fi
          done

          if [ -z "${binary}" ]; then
            echo "::error::the installer reported success but left no runnable binary (work order #298)"
            ls -la "${HOME}/.local/bin" "${HOME}/.claude/bin" 2>/dev/null || true
            exit 1
          fi

          "${binary}" --version
          echo "path=${binary}" >> "${GITHUB_OUTPUT}"

      # The prompt lives in `.github/reviewer-prompt.md` rather than here
      # because it is used twice - once, and again if the first pass ends
      # without leaving a review. Two copies of a hundred lines of
      # instructions would drift apart, and the drift would be invisible.
      - name: Build the reviewer's prompt
        id: prompt
        if: steps.hold.outputs.stand_aside == ''
        env:
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          text=$(sed -e "s/{{PR}}/${PR}/g" -e "s|{{REPO}}|${REPO}|g"             .github/reviewer-prompt.md)
          {
            echo "text<<REVIEWER_PROMPT_EOF"
            echo "${text}"
            echo "REVIEWER_PROMPT_EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: anthropics/claude-code-action@v1
        id: reviewer
        if: steps.hold.outputs.stand_aside == ''
        with:
          path_to_claude_code_executable: ${{ steps.agent-runtime.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A factory shift opens its pull request as the Claude app, and the
          # action refuses a run started by a bot unless it is named here.
          # Without this, every factory pull request fails a required check
          # (#595: "Workflow initiated by non-human actor: claude").
          allowed_bots: "claude,claude[bot]"
          claude_args: |
            --max-turns 150
            --allowedTools "Bash(cargo *),Bash(gh *),Read,Grep,Glob"
          prompt: ${{ steps.prompt.outputs.text }}

      # Twice - on #483 and #485 - the reviewer finished clean and left no
      # review: `is_error: false`, twenty-three turns, two denied tool
      # calls, nothing posted. Re-running the same job by hand then passed
      # both times, which is a person on the floor for a job that is
      # supposed to run without one.
      #
      # The denials are the likeliest cause and are addressed above: the
      # prompt told it to read CLAUDE.md and to grep, and the allowlist
      # gave it neither. But that is inferred from a counter, so this step
      # prints what was actually denied, and the retry below covers the
      # case where the cause turns out to be something else.
      - name: Did a review land
        id: first-pass
        if: always() && steps.hold.outputs.stand_aside == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/review-landed.sh

      - uses: anthropics/claude-code-action@v1
        id: retry
        if: always() && steps.hold.outputs.stand_aside == ''
          && steps.first-pass.outputs.landed == 'false'
        with:
          path_to_claude_code_executable: ${{ steps.agent-runtime.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A factory shift opens its pull request as the Claude app, and the
          # action refuses a run started by a bot unless it is named here.
          # Without this, every factory pull request fails a required check
          # (#595: "Workflow initiated by non-human actor: claude").
          allowed_bots: "claude,claude[bot]"
          claude_args: |
            --max-turns 150
            --allowedTools "Bash(cargo *),Bash(gh *),Read,Grep,Glob"
          prompt: ${{ steps.prompt.outputs.text }}

      # A green tick on this check used to mean one of two different things.
      # The action declines to run when the pull request modifies the
      # workflow that invokes it - a sound guard, since otherwise a branch
      # could rewrite its own reviewer - and then reports success. Pull
      # request #299 showed `review pass 30s` with nobody having reviewed
      # it, indistinguishable at a glance from the eight-to-thirteen minute
      # pass of a real review. This station is the repository's only
      # reviewer and is informational rather than required, so that was a
      # pull request merging unreviewed with nothing anywhere saying so.
      #
      # So: find out whether a review actually landed, and if it did not,
      # say which case it was and go red. Work order #300.
      #
      # It now runs after the retry rather than after the only attempt, so
      # red here means the reviewer declined to answer twice - work order
      # #486, where declining once was costing a manual re-run.
      - name: Confirm a review actually landed
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AGENT_OUTCOME: ${{ steps.reviewer.outcome }}
          RETRY_OUTCOME: ${{ steps.retry.outcome }}
          STAND_ASIDE: ${{ steps.hold.outputs.stand_aside }}
        run: |
          set -euo pipefail

          # Standing aside is a real answer, and it is the one the first
          # step already worked out. Reaching it again here would ask
          # the same question twice and could answer it differently.
          case "${STAND_ASIDE}" in
            dependabot)
              echo "Stood aside: opened by dependabot."
              exit 0
              ;;
            workflow)
              echo "Stood aside: this pull request edits a workflow, so"
              echo "workflow-review.yml reviews it from the base branch and holds"
              echo "it if it does not pass."
              exit 0
              ;;
          esac

          # Not whether a review landed on this exact head, but what it
          # decided: only an approval passes. Counting reviews let #595's
          # "request changes" go green (see .github/review-verdict.sh).
          landed=$(gh api "repos/${REPO}/pulls/${PR}/reviews" --jq "[.[] | select(.commit_id == \"${HEAD_SHA}\")] | length")
          if [ "${landed}" -gt 0 ]; then
            bash .github/review-verdict.sh
            exit $?
          fi

          echo "::error::Not reviewed, twice. The first pass finished as"
          echo "::error::'${AGENT_OUTCOME}' and the retry as '${RETRY_OUTCOME}', and neither"
          echo "::error::left a review on ${HEAD_SHA}. The 'Did a review land' step above"
          echo "::error::prints what the agent was denied; a runtime that failed to"
          echo "::error::install is work order #298's failure mode."
          exit 1
