name: Independent review

# A second, separately-invoked agent re-verifies a work-order PR before it's
# eligible to merge, rather than trusting the building agent's own claims of
# a passing fmt/clippy/test run. Read-only: never edits code, opens a PR, or
# pushes a commit - it only inspects the diff and leaves a
# `gh pr review --approve` or `--request-changes`.
#
# This does not yet gate merging: branch protection still only requires
# `fmt / clippy / test` (see ci.yml). Turning "require approvals" on so this
# review becomes a hard gate is a deliberate, separate follow-up once this
# workflow is proven working on real PRs - flipping it on prematurely could
# block the entire pipeline if this workflow has a bug.

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  # Needed for claude-code-action's OIDC-based token exchange with
  # CLAUDE_CODE_OAUTH_TOKEN, same as claude.yml/factory-shift.yml.
  id-token: write

jobs:
  review:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gui's native build dependencies (Slint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libx11-dev libxcb1-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev \
            libinput-dev libgbm-dev
      # The action installs the agent runtime itself, at a version hard-coded
      # inside it, and that install is intermittent: on 2026-09-08 the same
      # build 2.1.265 installed cleanly at 22:13 and, at 22:23, reported
      # "successfully installed" while leaving nothing at
      # /home/runner/.local/bin/claude - which the agent only discovered
      # after starting. Two re-runs failed the same way. See work order #298.
      #
      # So this installs the runtime, at a version this repository names,
      # and refuses to continue unless the binary is actually there and
      # runs. A station that cannot review is better than a station that
      # says nothing and leaves a red mark for somebody to notice.
      - name: Install the agent runtime
        id: agent-runtime
        env:
          # Bump deliberately, together with the other workflows that pin it.
          CLAUDE_CODE_VERSION: "2.1.265"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Installing Claude Code ${CLAUDE_CODE_VERSION}, attempt ${attempt}..."
            if curl -fsSL https://claude.ai/install.sh | bash -s -- "${CLAUDE_CODE_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::could not install the agent runtime after three attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

          # Where the installer is expected to leave it, then the places it
          # has been known to leave it instead. Finding it is better than
          # being right about where it should have been.
          binary=""
          for candidate in "${HOME}/.local/bin/claude" "${HOME}/.claude/bin/claude" "$(command -v claude || true)"; do
            if [ -n "${candidate}" ] && [ -x "${candidate}" ]; then
              binary="${candidate}"
              break
            fi
          done

          if [ -z "${binary}" ]; then
            echo "::error::the installer reported success but left no runnable binary (work order #298)"
            ls -la "${HOME}/.local/bin" "${HOME}/.claude/bin" 2>/dev/null || true
            exit 1
          fi

          "${binary}" --version
          echo "path=${binary}" >> "${GITHUB_OUTPUT}"

      - uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ steps.agent-runtime.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(cargo *),Bash(gh *)"
          prompt: |
            You are an independent reviewer for pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }}. You did not write this PR and have no
            memory of writing it - treat every claim it makes as unverified
            until you check it yourself.

            1. Read the PR diff (`gh pr diff ${{ github.event.pull_request.number }}`)
               and its description (`gh pr view ${{ github.event.pull_request.number }} --json body,title`).
               Find the `Closes #N` reference in the body and read that issue
               (`gh issue view N`) to learn what was actually asked for and its
               stated acceptance checks.
            2. Independently re-run, in this checked-out branch:
               - `cargo fmt --all -- --check`
               - `cargo clippy --all-targets --all-features -- -D warnings`
               - `cargo test --all-features`
               Do not trust the PR description's claim that these passed -
               run them yourself and read the actual output. Also re-check any
               acceptance checks from the issue that are checkable this way
               (e.g. a named grep, a specific file existing).
            3. Check the diff against this repo's CLAUDE.md rules, in
               particular rule 4 (surgical: does every changed line trace to
               the issue?) and rule 5 (no speculative structure: no
               abstraction for a single caller, no unrequested configurability).
            4. Check that any new behavior has a real, meaningful test - one
               that actually exercises the claimed behavior, not just a test
               that happens to exist nearby.
            5. If everything holds up, approve with a summary of what you
               independently verified:
               `gh pr review ${{ github.event.pull_request.number }} --approve --body "..."`
            6. If something doesn't hold up, name the specific problem and do
               not approve:
               `gh pr review ${{ github.event.pull_request.number }} --request-changes --body "..."`

            Make exactly one pass/fail judgment call, the way a human reviewer
            would - do not build a scoring rubric. Never edit any file, never
            open a PR, never push a commit; you only have Bash(cargo *) and
            Bash(gh *) available, no Edit or Write tool and no git access.
