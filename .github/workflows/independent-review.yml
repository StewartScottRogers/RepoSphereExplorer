name: Independent review

# A second, separately-invoked agent re-verifies a work-order PR before it's
# eligible to merge, rather than trusting the building agent's own claims of
# a passing fmt/clippy/test run. Read-only: never edits code, opens a PR, or
# pushes a commit - it only inspects the diff and leaves a
# `gh pr review --approve` or `--request-changes`.
#
# This does not yet gate merging: branch protection still only requires
# `fmt / clippy / test` (see ci.yml). Turning "require approvals" on so this
# review becomes a hard gate is a deliberate, separate follow-up once this
# workflow is proven working on real PRs - flipping it on prematurely could
# block the entire pipeline if this workflow has a bug.

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  # Needed for claude-code-action's OIDC-based token exchange with
  # CLAUDE_CODE_OAUTH_TOKEN, same as claude.yml/factory-shift.yml.
  id-token: write

jobs:
  review:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # A pull request that edits a workflow cannot be reviewed here, and
      # the station has said so honestly since #300. What it could not do
      # was stop the pull request: branch protection requires only
      # `fmt / clippy / test`, and GitHub's auto-merge lands the branch the
      # moment that passes. #438 changed the health check and merged
      # unreviewed thirteen minutes after this station went red.
      #
      # So find out first, before ten minutes of runner time go into a
      # review that will decline, and hold the pull request while the
      # required check is still running. Work order #439.
      - name: Hold a pull request that edits the factory itself
        id: hold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! gh pr diff "$PR" --repo "$REPO" --name-only | grep -q '^\.github/workflows/'; then
            echo "edits_workflows=false" >> "$GITHUB_OUTPUT"
            echo "No workflow files touched; the reviewer can run."
            exit 0
          fi
          echo "edits_workflows=true" >> "$GITHUB_OUTPUT"

          gh label create needs-human-review --repo "$REPO" --color 5319e7 \
            --description "Edits the factory itself; a person has to read it" \
            >/dev/null 2>&1 || true

          # Removing the label is not enough on its own: GitHub's auto-merge
          # stays enabled once `auto-merge.yml` has set it, label or no
          # label, so it has to be turned off explicitly.
          gh pr merge --disable-auto "$PR" --repo "$REPO" || true
          gh pr edit "$PR" --repo "$REPO" --remove-label auto-merge || true
          gh pr edit "$PR" --repo "$REPO" --add-label needs-human-review || true
          # A heredoc body would have to sit at column zero, which ends
          # the YAML block scalar this script lives in. printf keeps every
          # line indented inside it.
          gh pr comment "$PR" --repo "$REPO" --body "$(printf '%s\n' \
            'This pull request edits `.github/workflows/`, so the independent' \
            'reviewer declines to run on it: a branch must not be able to' \
            'rewrite its own reviewer.' \
            '' \
            'Auto-merge has been turned off and the `auto-merge` label removed,' \
            'because otherwise this would land as soon as `fmt / clippy / test`' \
            'went green, unreviewed. That is what happened to #438.' \
            '' \
            '**Read the diff, then merge it yourself** - or put the `auto-merge`' \
            'label back, which re-enables auto-merge, if you are content without' \
            'reading it.' \
            '' \
            'Work order #439.')"

      - uses: actions/checkout@v7
        if: steps.hold.outputs.edits_workflows != 'true'
      - name: Install gui's native build dependencies (Slint)
        if: steps.hold.outputs.edits_workflows != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libx11-dev libxcb1-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev \
            libinput-dev libgbm-dev
      # The action installs the agent runtime itself, at a version hard-coded
      # inside it, and that install is intermittent: on 2026-09-08 the same
      # build 2.1.265 installed cleanly at 22:13 and, at 22:23, reported
      # "successfully installed" while leaving nothing at
      # /home/runner/.local/bin/claude - which the agent only discovered
      # after starting. Two re-runs failed the same way. See work order #298.
      #
      # So this installs the runtime, at a version this repository names,
      # and refuses to continue unless the binary is actually there and
      # runs. A station that cannot review is better than a station that
      # says nothing and leaves a red mark for somebody to notice.
      - name: Install the agent runtime
        id: agent-runtime
        if: steps.hold.outputs.edits_workflows != 'true'
        env:
          # Bump deliberately, together with the other workflows that pin it.
          CLAUDE_CODE_VERSION: "2.1.265"
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Installing Claude Code ${CLAUDE_CODE_VERSION}, attempt ${attempt}..."
            if curl -fsSL https://claude.ai/install.sh | bash -s -- "${CLAUDE_CODE_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::could not install the agent runtime after three attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

          # Where the installer is expected to leave it, then the places it
          # has been known to leave it instead. Finding it is better than
          # being right about where it should have been.
          binary=""
          for candidate in "${HOME}/.local/bin/claude" "${HOME}/.claude/bin/claude" "$(command -v claude || true)"; do
            if [ -n "${candidate}" ] && [ -x "${candidate}" ]; then
              binary="${candidate}"
              break
            fi
          done

          if [ -z "${binary}" ]; then
            echo "::error::the installer reported success but left no runnable binary (work order #298)"
            ls -la "${HOME}/.local/bin" "${HOME}/.claude/bin" 2>/dev/null || true
            exit 1
          fi

          "${binary}" --version
          echo "path=${binary}" >> "${GITHUB_OUTPUT}"

      - uses: anthropics/claude-code-action@v1
        id: reviewer
        if: steps.hold.outputs.edits_workflows != 'true'
        with:
          path_to_claude_code_executable: ${{ steps.agent-runtime.outputs.path }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(cargo *),Bash(gh *)"
          prompt: |
            You are an independent reviewer for pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }}. You did not write this PR and have no
            memory of writing it - treat every claim it makes as unverified
            until you check it yourself.

            1. Read the PR diff (`gh pr diff ${{ github.event.pull_request.number }}`)
               and its description (`gh pr view ${{ github.event.pull_request.number }} --json body,title`).
               Find the `Closes #N` reference in the body and read that issue
               (`gh issue view N`) to learn what was actually asked for and its
               stated acceptance checks.
            2. Independently re-run, in this checked-out branch:
               - `cargo fmt --all -- --check`
               - `cargo clippy --all-targets --all-features -- -D warnings`
               - `cargo test --all-features`
               Do not trust the PR description's claim that these passed -
               run them yourself and read the actual output. Also re-check any
               acceptance checks from the issue that are checkable this way
               (e.g. a named grep, a specific file existing).
            3. Check the diff against this repo's CLAUDE.md rules, in
               particular rule 4 (surgical: does every changed line trace to
               the issue?) and rule 5 (no speculative structure: no
               abstraction for a single caller, no unrequested configurability).
            4. Check that any new behavior has a real, meaningful test - one
               that actually exercises the claimed behavior, not just a test
               that happens to exist nearby.
            5. If everything holds up, approve with a summary of what you
               independently verified:
               `gh pr review ${{ github.event.pull_request.number }} --approve --body "..."`
            6. If something doesn't hold up, name the specific problem and do
               not approve:
               `gh pr review ${{ github.event.pull_request.number }} --request-changes --body "..."`

            Make exactly one pass/fail judgment call, the way a human reviewer
            would - do not build a scoring rubric. Never edit any file, never
            open a PR, never push a commit; you only have Bash(cargo *) and
            Bash(gh *) available, no Edit or Write tool and no git access.

      # A green tick on this check used to mean one of two different things.
      # The action declines to run when the pull request modifies the
      # workflow that invokes it - a sound guard, since otherwise a branch
      # could rewrite its own reviewer - and then reports success. Pull
      # request #299 showed `review pass 30s` with nobody having reviewed
      # it, indistinguishable at a glance from the eight-to-thirteen minute
      # pass of a real review. This station is the repository's only
      # reviewer and is informational rather than required, so that was a
      # pull request merging unreviewed with nothing anywhere saying so.
      #
      # So: find out whether a review actually landed, and if it did not,
      # say which case it was and go red. Red here blocks nothing - the
      # required check is `fmt / clippy / test` - it only stops the tick
      # from lying. Work order #300.
      - name: Confirm a review actually landed
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AGENT_OUTCOME: ${{ steps.reviewer.outcome }}
        run: |
          set -euo pipefail

          # Reviews on this exact head: an approval of an earlier push is
          # not a review of what is being merged now.
          # `gh api --jq` takes a filter, not jq's `--arg`, so the head goes
          # into the filter itself.
          filter="[.[] | select(.commit_id == \"${HEAD_SHA}\")] | length"
          landed=$(gh api "repos/${REPO}/pulls/${PR}/reviews" --jq "${filter}")

          if [ "${landed}" -gt 0 ]; then
            echo "Reviewed: ${landed} review(s) on ${HEAD_SHA}."
            # A hold put on by an earlier run of this station has served
            # its purpose once a review lands - the runtime failing to
            # install (#298) is transient, and the pull request should go
            # back to merging itself. Re-adding the label is what does it:
            # `auto-merge.yml` triggers on `labeled`.
            held=$(gh pr view "${PR}" --repo "${REPO}" --json labels \
              --jq '[.labels[].name] | index("needs-human-review") // empty')
            if [ -n "${held}" ]; then
              echo "Releasing the hold: a review landed on ${HEAD_SHA}."
              gh pr edit "${PR}" --repo "${REPO}" --remove-label needs-human-review || true
              gh pr edit "${PR}" --repo "${REPO}" --add-label auto-merge || true
            fi
            exit 0
          fi

          # Nothing landed. Which of the two reasons was it?
          if gh pr diff "${PR}" --repo "${REPO}" --name-only | grep -q '^\.github/workflows/'; then
            echo "::error::Not reviewed. This pull request edits a workflow, so the"
            echo "::error::reviewer declined to run - it refuses to review a branch that"
            echo "::error::could rewrite its own reviewer. That guard is right; the green"
            echo "::error::tick it used to leave was not. Auto-merge has been turned off"
            echo "::error::and the pull request labelled needs-human-review, so it waits"
            echo "::error::rather than landing unread as #438 did. Read this one yourself."
          else
            echo "::error::Not reviewed. The agent step finished as '${AGENT_OUTCOME}' and"
            echo "::error::left no review on ${HEAD_SHA}. Check the log above: a runtime"
            echo "::error::that failed to install is work order #298's failure mode."
          fi
          exit 1
