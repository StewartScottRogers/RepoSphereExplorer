name: Distribution

# What a reader actually gets, tested the way a reader gets it: a release's
# files installed with scripts/install.ps1 or scripts/install.sh, verified
# against the signed manifest, run from where they were put, updated in
# place, and uninstalled until nothing is left.
#
# Two ways in. release.yml calls it with from-artifacts, against the files
# its build job has just made, before they are published - so a release
# nobody can install fails the release. The schedule and a manual run test
# the published latest release, the one a reader downloads today.

on:
  workflow_call:
    inputs:
      from-artifacts:
        description: Test this run's build artifacts instead of the published release
        type: boolean
        default: true
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  LATEST_MANIFEST_URL: https://stewartscottrogers.github.io/RepoSphereExplorer/latest.json

jobs:
  distribution:
    name: distribution (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      FROM_ARTIFACTS: ${{ inputs.from-artifacts && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Where things go on this platform
        shell: bash
        run: |
          case "${RUNNER_OS}" in
            Windows)
              echo "PREFIX=${LOCALAPPDATA}\\Programs\\RepoSphereExplorer" >> "$GITHUB_ENV"
              echo "DATA_DIR=${LOCALAPPDATA}\\RepoSphereExplorer" >> "$GITHUB_ENV"
              echo "SHORTCUT=${APPDATA}\\Microsoft\\Windows\\Start Menu\\Programs\\Repos Explorer.lnk" >> "$GITHUB_ENV"
              echo "UNINSTALL_KEY=HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\ReposExplorer" >> "$GITHUB_ENV"
              ;;
            Linux)
              echo "PREFIX=${HOME}/.local/share/RepoSphereExplorer" >> "$GITHUB_ENV"
              echo "DATA_DIR=${HOME}/.local/share/RepoSphereExplorer" >> "$GITHUB_ENV"
              echo "BIN_DIR=${HOME}/.local/bin" >> "$GITHUB_ENV"
              ;;
            macOS)
              echo "PREFIX=${HOME}/Applications/RepoSphereExplorer" >> "$GITHUB_ENV"
              echo "DATA_DIR=${HOME}/Library/Application Support/RepoSphereExplorer" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Install the graphical application's runtime libraries and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils libfontconfig1-dev libx11-dev libxcb1-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev \
            libinput-dev libgbm-dev

      # What the Linux desktop checks below need, and nothing else does:
      # the validator the freedesktop specification ships, and the
      # filesystem-in-userspace (FUSE) library an AppImage mounts itself
      # with. The library is named for the release; the older name is the
      # fallback.
      - name: Tools the Linux desktop checks need (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          sudo apt-get install -y --no-install-recommends libfuse2t64 \
            || sudo apt-get install -y --no-install-recommends libfuse2

      - uses: Swatinem/rust-cache@v2
      - name: Build the smoke client
        run: cargo build -p protocol --bin smoke

      # ---- the release files: this run's artifacts, or the published release

      - name: Take this run's build artifacts
        if: env.FROM_ARTIFACTS == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target }}
          path: release
      - name: Take this run's signed manifest
        if: env.FROM_ARTIFACTS == 'true'
        uses: actions/download-artifact@v8
        with:
          name: manifest
          path: release
      - name: Download the published latest release, for the tamper checks
        if: env.FROM_ARTIFACTS != 'true'
        shell: bash
        run: |
          mkdir -p release
          curl -fsSL "$LATEST_MANIFEST_URL" -o release/manifest.json
          version="$(tr -d '\r\n' < release/manifest.json | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
          gh release download "v${version}" --repo "${{ github.repository }}" \
            --pattern "*-${{ matrix.target }}*" --dir release
          ls -la release
      # The setup program (#560) is published under a name with no target
      # triple in it, so the pattern above does not reach it.
      - name: Download the published setup program (Windows)
        if: runner.os == 'Windows' && env.FROM_ARTIFACTS != 'true'
        shell: bash
        run: |
          version="$(tr -d '\r\n' < release/manifest.json | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
          gh release download "v${version}" --repo "${{ github.repository }}" \
            --pattern "ReposExplorerSetup.exe" --dir release
          ls -la release

      # ---- install

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if ($env:FROM_ARTIFACTS -eq 'true') {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -FromDirectory release
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1
          }
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Install (Windows)::install.ps1 failed"; exit 1 }
          Get-ChildItem -Force $env:PREFIX
          foreach ($name in 'RepoSphereExplorerGui.exe', 'RepoSphereExplorerTui.exe', 'service.exe') {
            if (-not (Test-Path (Join-Path $env:PREFIX $name))) {
              Write-Output "::error title=Install (Windows)::$name is not in $env:PREFIX"; exit 1
            }
          }
      # A per-user install that Windows does not know about is half an
      # install: no Start menu entry, nothing in Settings > Apps, no way to
      # remove it but the script a reader downloaded and probably deleted.
      - name: Windows knows the application is installed (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          $gui = Join-Path $env:PREFIX 'RepoSphereExplorerGui.exe'

          if (-not (Test-Path -LiteralPath $env:SHORTCUT)) {
            Write-Output "::error title=Start menu (Windows)::no shortcut at $env:SHORTCUT"; exit 1
          }
          $shell = New-Object -ComObject WScript.Shell
          $link = $shell.CreateShortcut($env:SHORTCUT)
          Write-Output "shortcut $env:SHORTCUT"
          Write-Output "  target '$($link.TargetPath)' in '$($link.WorkingDirectory)'"
          Write-Output "  icon '$($link.IconLocation)' description '$($link.Description)'"
          if ($link.TargetPath -ne $gui) {
            Write-Output "::error title=Start menu (Windows)::the shortcut points at '$($link.TargetPath)', not $gui"; $failed = $true
          }
          if ($link.WorkingDirectory -ne $env:PREFIX) {
            Write-Output "::error title=Start menu (Windows)::the shortcut works in '$($link.WorkingDirectory)', not $env:PREFIX"; $failed = $true
          }
          foreach ($part in @(@('Description', $link.Description), @('IconLocation', $link.IconLocation))) {
            if (-not $part[1]) { Write-Output "::error title=Start menu (Windows)::the shortcut has no $($part[0])"; $failed = $true }
          }

          if (-not (Test-Path -LiteralPath $env:UNINSTALL_KEY)) {
            Write-Output "::error title=Apps entry (Windows)::no registry key at $env:UNINSTALL_KEY"; exit 1
          }
          $entry = Get-ItemProperty -LiteralPath $env:UNINSTALL_KEY
          $entry | Format-List DisplayName, DisplayVersion, Publisher, DisplayIcon, InstallLocation,
            EstimatedSize, NoModify, NoRepair, UninstallString | Out-String -Width 200
          foreach ($name in 'DisplayName', 'DisplayVersion', 'Publisher', 'DisplayIcon', 'InstallLocation',
            'EstimatedSize', 'NoModify', 'NoRepair', 'UninstallString') {
            if (-not $entry.$name) { Write-Output "::error title=Apps entry (Windows)::$name is missing or empty"; $failed = $true }
          }
          if ($entry.InstallLocation -ne $env:PREFIX) {
            Write-Output "::error title=Apps entry (Windows)::InstallLocation is '$($entry.InstallLocation)', not $env:PREFIX"; $failed = $true
          }
          if ($entry.DisplayIcon -ne $gui) {
            Write-Output "::error title=Apps entry (Windows)::DisplayIcon is '$($entry.DisplayIcon)', not $gui"; $failed = $true
          }
          # The Uninstall button runs this string long after the downloaded
          # copy of the script is gone, so it has to name a script that is
          # still there. The uninstall step below runs the string itself.
          if ($entry.UninstallString -notmatch '-File "([^"]+)"') {
            Write-Output "::error title=Apps entry (Windows)::UninstallString runs no -File script: $($entry.UninstallString)"; $failed = $true
          }
          elseif (-not (Test-Path -LiteralPath $matches[1])) {
            Write-Output "::error title=Apps entry (Windows)::UninstallString runs $($matches[1]), which is not there"; $failed = $true
          }
          if ($failed) { exit 1 }

      # The other way in (#560): the same release, installed by the setup
      # program a reader double-clicks instead of running a script. Its own
      # prefix, Start menu folder and registry key, so it neither disturbs
      # the install above nor is disturbed by it - the two are the same
      # install, which is the point, and only one of them can own the real
      # Start menu entry at a time.
      - name: The setup program installs, runs and removes a release (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $setup = Join-Path $env:RUNNER_TEMP 'ReposExplorerSetup.exe'
          Copy-Item -LiteralPath (Join-Path 'release' 'ReposExplorerSetup.exe') -Destination $setup
          $prefix = Join-Path $env:RUNNER_TEMP 'by-the-setup-program'
          $menu = Join-Path $env:RUNNER_TEMP 'setup-start-menu'
          $key = 'HKCU:\Software\RepoSphereExplorerDistributionCheck\Setup\ReposExplorer'
          $shortcut = Join-Path $menu 'Repos Explorer.lnk'
          $gui = Join-Path $prefix 'RepoSphereExplorerGui.exe'
          # From this run's artifacts before they are published; from the
          # published release otherwise, which is the download a reader makes.
          $source = @()
          if ($env:FROM_ARTIFACTS -eq 'true') { $source = @('--from-directory', 'release') }

          & $setup --quiet --prefix $prefix --start-menu-directory $menu --uninstall-registry-key $key @source
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Setup program (Windows)::the install failed"; exit 1 }
          Get-ChildItem -Force $prefix
          foreach ($name in 'RepoSphereExplorerGui.exe', 'RepoSphereExplorerTui.exe', 'service.exe', 'ReposExplorerSetup.exe', 'installed-files.txt') {
            if (-not (Test-Path (Join-Path $prefix $name))) {
              Write-Output "::error title=Setup program (Windows)::$name is not in $prefix"; exit 1
            }
          }

          if (-not (Test-Path -LiteralPath $shortcut)) {
            Write-Output "::error title=Setup program (Windows)::no Start menu shortcut at $shortcut"; exit 1
          }
          $shell = New-Object -ComObject WScript.Shell
          $link = $shell.CreateShortcut($shortcut)
          Write-Output "shortcut target '$($link.TargetPath)' in '$($link.WorkingDirectory)'"
          Write-Output "  icon '$($link.IconLocation)' description '$($link.Description)'"
          $failed = $false
          if ($link.TargetPath -ne $gui) {
            Write-Output "::error title=Setup program (Windows)::the shortcut points at '$($link.TargetPath)', not $gui"; $failed = $true
          }
          foreach ($part in @(@('WorkingDirectory', $link.WorkingDirectory), @('Description', $link.Description), @('IconLocation', $link.IconLocation))) {
            if (-not $part[1]) { Write-Output "::error title=Setup program (Windows)::the shortcut has no $($part[0])"; $failed = $true }
          }

          if (-not (Test-Path -LiteralPath $key)) {
            Write-Output "::error title=Setup program (Windows)::no registry key at $key"; exit 1
          }
          $entry = Get-ItemProperty -LiteralPath $key
          $entry | Format-List DisplayName, DisplayVersion, Publisher, DisplayIcon, InstallLocation,
            EstimatedSize, NoModify, NoRepair, UninstallString | Out-String -Width 200
          foreach ($name in 'DisplayName', 'DisplayVersion', 'Publisher', 'DisplayIcon', 'InstallLocation',
            'EstimatedSize', 'NoModify', 'NoRepair', 'UninstallString') {
            if (-not $entry.$name) { Write-Output "::error title=Setup program (Windows)::$name is missing or empty"; $failed = $true }
          }
          if ($entry.InstallLocation -ne $prefix) {
            Write-Output "::error title=Setup program (Windows)::InstallLocation is '$($entry.InstallLocation)', not $prefix"; $failed = $true
          }
          if ($entry.DisplayIcon -ne $gui) {
            Write-Output "::error title=Setup program (Windows)::DisplayIcon is '$($entry.DisplayIcon)', not $gui"; $failed = $true
          }
          if ($entry.UninstallString -notmatch '"([^"]+ReposExplorerSetup\.exe)"') {
            Write-Output "::error title=Setup program (Windows)::UninstallString does not run the setup program: $($entry.UninstallString)"; $failed = $true
          }
          elseif (-not (Test-Path -LiteralPath $matches[1])) {
            Write-Output "::error title=Setup program (Windows)::UninstallString runs $($matches[1]), which is not there"; $failed = $true
          }
          if ($failed) { exit 1 }

          # What was installed runs, from where it was put.
          $scratch = Join-Path $env:RUNNER_TEMP 'scratch'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          $application = Start-Process -FilePath $gui -ArgumentList "`"$scratch`"" -PassThru
          $null = $application.Handle
          Start-Sleep -Seconds 10
          $application.Refresh()
          if ($application.HasExited) {
            Write-Output "::error title=Setup program (Windows)::the installed application exited, code $($application.ExitCode)"; exit 1
          }
          Write-Output "window: '$($application.MainWindowTitle)' handle $($application.MainWindowHandle)"
          if ($application.MainWindowHandle -eq 0) { Write-Output "::error title=Setup program (Windows)::the installed application opened no window"; exit 1 }

          # Removed the way Settings > Apps removes it: by running the string
          # the install wrote, with the application still open. That string
          # runs the copy in the install folder, which starts another copy
          # outside it - Windows will not let a running program delete its
          # own file - so the removal outlives the command that began it.
          $uninstall = $entry.UninstallString
          Write-Output "UninstallString: $uninstall"
          $command = Join-Path $env:RUNNER_TEMP 'setup-uninstall.cmd'
          Set-Content -LiteralPath $command -Value $uninstall -Encoding ASCII
          & $env:ComSpec /c $command
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Setup program (Windows)::the UninstallString failed"; exit 1 }
          foreach ($attempt in 1..60) {
            if (-not (Test-Path $prefix)) { break }
            Start-Sleep -Seconds 1
          }
          # That copy reports what it removed in a window, and nothing on a
          # runner is going to close it.
          Get-Process ReposExplorerSetup -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path $prefix) {
            Get-ChildItem -Force $prefix | Format-Table -AutoSize | Out-String -Width 200
            Write-Output "::error title=Setup program (Windows)::$prefix remains"; $failed = $true
          }
          if (Test-Path -LiteralPath $shortcut) { Write-Output "::error title=Setup program (Windows)::$shortcut remains"; $failed = $true }
          if (Test-Path -LiteralPath $key) { Write-Output "::error title=Setup program (Windows)::$key remains"; $failed = $true }
          $left = @(Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase) })
          $left | Format-Table Id, Path -AutoSize | Out-String -Width 200
          if ($left.Count -gt 0) { Write-Output "::error title=Setup program (Windows)::processes from the install remain"; $failed = $true }
          # Nothing left to remove, so a second one says so and stops.
          & $setup --quiet --uninstall --prefix $prefix
          if ($LASTEXITCODE -eq 0) { Write-Output "::error title=Setup program (Windows)::a second uninstall was not refused"; $failed = $true }
          if ($failed) { exit 1 }
          exit 0

      - name: Install (${{ runner.os }})
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$FROM_ARTIFACTS" = true ]; then
            scripts/install.sh --from-directory release
          else
            scripts/install.sh
          fi
          ls -la "$PREFIX"
          for name in RepoSphereExplorerGui RepoSphereExplorerTui service; do
            [ -x "$PREFIX/$name" ] || { echo "::error title=Install (${RUNNER_OS})::$name is not in $PREFIX"; exit 1; }
          done
          if [ "$RUNNER_OS" = Linux ]; then
            ls -la "$BIN_DIR"
            for name in RepoSphereExplorerGui RepoSphereExplorerTui; do
              [ "$(readlink "$BIN_DIR/$name")" = "$PREFIX/$name" ] \
                || { echo "::error title=Install (Linux)::$BIN_DIR/$name does not link to $PREFIX/$name"; exit 1; }
            done
          fi

      # A Mac has one layout however it was installed: the command-line
      # install puts the three inside the same `Repos Explorer.app` the disk
      # image carries, and links them beside it so the command line can still
      # name them.
      - name: The command-line install lays out the application bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          fail() { echo "::error title=Bundle from install.sh (macOS)::$*"; exit 1; }
          app="$PREFIX/Repos Explorer.app"
          [ -d "$app" ] || fail "install.sh left no Repos Explorer.app in $PREFIX"
          find "$app" -print
          plutil -lint "$app/Contents/Info.plist" || fail "the Info.plist it wrote is not a valid property list"
          plutil -p "$app/Contents/Info.plist"
          for name in RepoSphereExplorerGui RepoSphereExplorerTui service; do
            [ -x "$app/Contents/MacOS/$name" ] || fail "$name is not in Contents/MacOS"
            [ "$(readlink "$PREFIX/$name")" = "Repos Explorer.app/Contents/MacOS/$name" ] \
              || fail "$PREFIX/$name does not link into the bundle"
          done

      # A Linux install a desktop does not know about is half an install:
      # nothing in the applications menu, and a blank square where the
      # window's icon should be.
      - name: The desktop knows the application is installed (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          entry="$HOME/.local/share/applications/reposphereexplorer.desktop"
          icons="$HOME/.local/share/icons/hicolor"
          if [ ! -f "$entry" ]; then
            echo "::error title=Desktop entry (Linux)::no desktop entry at $entry"; exit 1
          fi
          cat "$entry"
          failed=""
          desktop-file-validate "$entry" \
            || { echo "::error title=Desktop entry (Linux)::desktop-file-validate refused it"; failed=1; }
          grep -qxF "Exec=\"$PREFIX/RepoSphereExplorerGui\" %f" "$entry" \
            || { echo "::error title=Desktop entry (Linux)::Exec does not run $PREFIX/RepoSphereExplorerGui with %f"; failed=1; }
          grep -qxF "Icon=reposphereexplorer" "$entry" \
            || { echo "::error title=Desktop entry (Linux)::Icon does not name the installed icon"; failed=1; }
          find "$icons" -type f 2>/dev/null | sort || true
          for size in 16 32 48 64 128 256; do
            picture="$icons/${size}x${size}/apps/reposphereexplorer.png"
            if [ ! -f "$picture" ]; then
              echo "::error title=Themed icon (Linux)::no icon at $picture"; failed=1; continue
            fi
            file "$picture" | grep -qE "PNG image data, $size x $size" \
              || { echo "::error title=Themed icon (Linux)::$picture is not a ${size}x${size} picture: $(file -b "$picture")"; failed=1; }
          done
          drawing="$icons/scalable/apps/reposphereexplorer.svg"
          grep -q "<svg" "$drawing" 2>/dev/null \
            || { echo "::error title=Themed icon (Linux)::no drawing at $drawing"; failed=1; }
          [ -z "$failed" ]

      # ---- verification refuses what it should

      - name: Refuse a tampered asset and a re-hashed one (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $asset = "service-${{ matrix.target }}.exe"
          foreach ($case in 'bytes', 'rehashed') {
            $dir = Join-Path $env:RUNNER_TEMP "tampered-$case"
            $prefix = Join-Path $env:RUNNER_TEMP "tampered-prefix-$case"
            Copy-Item -Recurse release $dir
            $file = Join-Path $dir $asset
            $old = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            [IO.File]::AppendAllText($file, 'tampered')
            $expected = 'its digest does not match the manifest'
            if ($case -eq 'rehashed') {
              $new = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
              $manifest = Join-Path $dir 'manifest.json'
              [IO.File]::WriteAllText($manifest, ([IO.File]::ReadAllText($manifest) -replace $old, $new))
              $expected = 'signature verification failed'
            }
            $output = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -FromDirectory $dir -Prefix $prefix 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Output $output
            if ($code -eq 0 -or $output -notmatch $expected -or (Test-Path $prefix)) {
              Write-Output "::error title=Refuse tampered asset (Windows)::the $case case was not refused as expected"; exit 1
            }
          }
          exit 0
      # The same two cases against the setup program (#560): the file a
      # reader downloads has to refuse them as firmly as the script does,
      # and place nothing when it does.
      - name: The setup program refuses a tampered asset and a re-hashed one (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $setup = Join-Path $env:RUNNER_TEMP 'ReposExplorerSetup.exe'
          Copy-Item -LiteralPath (Join-Path 'release' 'ReposExplorerSetup.exe') -Destination $setup -Force
          $asset = "service-${{ matrix.target }}.exe"
          foreach ($case in 'bytes', 'rehashed') {
            $dir = Join-Path $env:RUNNER_TEMP "setup-tampered-$case"
            $prefix = Join-Path $env:RUNNER_TEMP "setup-tampered-prefix-$case"
            $menu = Join-Path $env:RUNNER_TEMP "setup-tampered-menu-$case"
            $key = "HKCU:\Software\RepoSphereExplorerDistributionCheck\Setup\Tampered-$case"
            Copy-Item -Recurse release $dir
            $file = Join-Path $dir $asset
            $old = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            [IO.File]::AppendAllText($file, 'tampered')
            $expected = 'its digest does not match the manifest'
            if ($case -eq 'rehashed') {
              $new = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
              $manifest = Join-Path $dir 'manifest.json'
              [IO.File]::WriteAllText($manifest, ([IO.File]::ReadAllText($manifest) -replace $old, $new))
              $expected = 'signature verification failed'
            }
            $output = & $setup --quiet --from-directory $dir --prefix $prefix `
              --start-menu-directory $menu --uninstall-registry-key $key 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Output $output
            # Windows PowerShell wraps a native program's error output at the
            # console width, so a refusal can arrive split across lines -
            # "does not match" on one and "the manifest" on the next. Match
            # the words, not the line breaks.
            $said = $output -replace '\s+', ' '
            if ($code -eq 0 -or $said -notmatch $expected -or (Test-Path $prefix) -or (Test-Path -LiteralPath $key)) {
              Write-Output "::error title=Setup program refuses tampering (Windows)::the $case case was not refused as expected"; exit 1
            }
          }
          exit 0
      - name: Refuse a tampered asset and a re-hashed one (${{ runner.os }})
        if: runner.os != 'Windows'
        shell: bash
        run: |
          asset="service-${{ matrix.target }}"
          bin_args=()
          [ "$RUNNER_OS" != Linux ] || bin_args=(--bin-dir "$RUNNER_TEMP/tampered-bin")
          digest() { if command -v sha256sum >/dev/null; then sha256sum "$1" | cut -d' ' -f1; else shasum -a 256 "$1" | cut -d' ' -f1; fi; }
          for case in bytes rehashed; do
            dir="$RUNNER_TEMP/tampered-$case"
            prefix="$RUNNER_TEMP/tampered-prefix-$case"
            cp -R release "$dir"
            old="$(digest "$dir/$asset")"
            printf tampered >> "$dir/$asset"
            expected="its digest does not match the manifest"
            if [ "$case" = rehashed ]; then
              new="$(digest "$dir/$asset")"
              perl -pi -e "s/$old/$new/g" "$dir/manifest.json"
              expected="signature verification failed"
            fi
            if output="$(scripts/install.sh --from-directory "$dir" --prefix "$prefix" "${bin_args[@]}" 2>&1)"; then
              echo "$output"
              echo "::error title=Refuse tampered asset (${RUNNER_OS})::the $case case installed"; exit 1
            fi
            echo "$output"
            case "$output" in *"$expected"*) ;; *) echo "::error title=Refuse tampered asset (${RUNNER_OS})::the $case case failed for the wrong reason"; exit 1 ;; esac
            [ ! -e "$prefix" ] || { echo "::error title=Refuse tampered asset (${RUNNER_OS})::the $case case placed files"; exit 1; }
          done

      # ---- run

      - name: Service answers ListDirectory (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP 'scratch'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          Set-Content (Join-Path $scratch 'smoke-marker.txt') 'marker'
          $service = Start-Process -FilePath (Join-Path $env:PREFIX 'service.exe') -PassThru -WindowStyle Hidden
          & target\debug\smoke.exe $scratch smoke-marker.txt
          $code = $LASTEXITCODE
          Stop-Process -Id $service.Id -Force
          $service.WaitForExit(10000) | Out-Null
          if ($code -ne 0) { Write-Output "::error title=Service smoke (Windows)::the installed service did not answer ListDirectory"; exit 1 }
      - name: Service answers ListDirectory (${{ runner.os }})
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scratch="$RUNNER_TEMP/scratch"
          mkdir -p "$scratch"
          echo marker > "$scratch/smoke-marker.txt"
          "$PREFIX/service" &
          service=$!
          code=0
          target/debug/smoke "$scratch" smoke-marker.txt || code=$?
          kill "$service"
          wait "$service" || true
          [ "$code" -eq 0 ] || { echo "::error title=Service smoke (${RUNNER_OS})::the installed service did not answer ListDirectory"; exit 1; }

      - name: Graphical application starts, opens a window and starts its own service (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP 'scratch'
          if (Get-Process service -ErrorAction SilentlyContinue) { Write-Output "::error title=GUI (Windows)::a service was already running"; exit 1 }
          $guiLog = Join-Path $env:RUNNER_TEMP 'gui.log'
          $gui = Start-Process -FilePath (Join-Path $env:PREFIX 'RepoSphereExplorerGui.exe') -ArgumentList "`"$scratch`"" -PassThru -RedirectStandardError $guiLog
          $null = $gui.Handle
          Start-Sleep -Seconds 10
          $gui.Refresh()
          if ($gui.HasExited) { Get-Content $guiLog -ErrorAction SilentlyContinue; Write-Output "::error title=GUI (Windows)::exited after starting, code $($gui.ExitCode)"; exit 1 }
          Write-Output "window: '$($gui.MainWindowTitle)' handle $($gui.MainWindowHandle)"
          if ($gui.MainWindowHandle -eq 0) { Write-Output "::error title=GUI (Windows)::no window"; exit 1 }
          $service = Get-Process service -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq (Join-Path $env:PREFIX 'service.exe') }
          if (-not $service) { Write-Output "::error title=GUI (Windows)::did not start the service beside it"; exit 1 }
          Write-Output "service running from $($service.Path)"
          $null = $gui.CloseMainWindow()
          if (-not $gui.WaitForExit(15000)) { Stop-Process -Id $gui.Id -Force; Write-Output "::error title=GUI (Windows)::did not exit when its window was closed"; exit 1 }
          if ($gui.ExitCode -ne 0) { Write-Output "::error title=GUI (Windows)::exited with $($gui.ExitCode) when closed"; exit 1 }
      - name: Graphical application starts, opens a window and starts its own service (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/gui-check.sh" <<'CHECK'
          set -uo pipefail
          "$PREFIX/RepoSphereExplorerGui" "$RUNNER_TEMP/scratch" > "$RUNNER_TEMP/gui.log" 2>&1 &
          gui=$!
          sleep 10
          if ! kill -0 "$gui" 2>/dev/null; then cat "$RUNNER_TEMP/gui.log"; echo "::error title=GUI (Linux)::exited after starting"; exit 1; fi
          xwininfo -root -tree | grep -F '"Repos Explorer"' || { echo "::error title=GUI (Linux)::no Repos Explorer window"; kill "$gui"; exit 1; }
          ps -A -o args= > "$RUNNER_TEMP/processes.txt"
          grep -Fx "$PREFIX/service" "$RUNNER_TEMP/processes.txt" || { echo "::error title=GUI (Linux)::did not start the service beside it"; kill "$gui"; exit 1; }
          kill "$gui"
          for _ in $(seq 1 20); do kill -0 "$gui" 2>/dev/null || exit 0; sleep 0.5; done
          echo "::error title=GUI (Linux)::did not stop"; exit 1
          CHECK
          if pgrep -x service; then echo "::error title=GUI (Linux)::a service was already running"; exit 1; fi
          xvfb-run -a -s "-screen 0 1280x800x24" bash "$RUNNER_TEMP/gui-check.sh"
      # The join no test in the tree can reach: the name the window actually
      # carries, read off a real X server, against the StartupWMClass in the
      # entry the install wrote. Get either wrong and the desktop shows a
      # blank icon and a second taskbar button beside the menu entry.
      - name: The window carries the desktop entry's StartupWMClass (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/wm-class.sh" <<'CHECK'
          set -uo pipefail
          entry="$HOME/.local/share/applications/reposphereexplorer.desktop"
          wanted="$(sed -n 's/^StartupWMClass=//p' "$entry")"
          [ -n "$wanted" ] || { echo "::error title=StartupWMClass (Linux)::the entry names no StartupWMClass"; exit 1; }
          "$PREFIX/RepoSphereExplorerGui" "$RUNNER_TEMP/scratch" > "$RUNNER_TEMP/wm-class-gui.log" 2>&1 &
          gui=$!
          sleep 10
          if ! kill -0 "$gui" 2>/dev/null; then
            cat "$RUNNER_TEMP/wm-class-gui.log"
            echo "::error title=StartupWMClass (Linux)::the window exited before it could be read"; exit 1
          fi
          window="$(xwininfo -root -tree | awk '/"Repos Explorer"/ { print $1; exit }')"
          if [ -z "$window" ]; then
            echo "::error title=StartupWMClass (Linux)::no Repos Explorer window"; kill "$gui"; exit 1
          fi
          class="$(xprop -id "$window" WM_CLASS)"
          echo "the window says: $class"
          echo "the entry says: StartupWMClass=$wanted"
          kill "$gui"
          case "$class" in
            *"\"$wanted\""*) ;;
            *) echo "::error title=StartupWMClass (Linux)::the entry would never match this window"; exit 1 ;;
          esac
          CHECK
          xvfb-run -a -s "-screen 0 1280x800x24" bash "$RUNNER_TEMP/wm-class.sh"

      - name: Graphical application starts and starts its own service (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if pgrep -x service; then echo "::error title=GUI (macOS)::a service was already running"; exit 1; fi
          "$PREFIX/RepoSphereExplorerGui" "$RUNNER_TEMP/scratch" > "$RUNNER_TEMP/gui.log" 2>&1 &
          gui=$!
          sleep 10
          if ! kill -0 "$gui" 2>/dev/null; then cat "$RUNNER_TEMP/gui.log"; echo "::error title=GUI (macOS)::exited after starting"; exit 1; fi
          ps -A -o args= > "$RUNNER_TEMP/processes.txt"
          # The install puts the three inside `Repos Explorer.app` and links
          # them beside it, so the graphical application's own path - and the
          # service it starts next to itself - is either the link or the file
          # in Contents/MacOS, depending on whether macOS resolved the link
          # before handing the path over. Both are the same install.
          grep -Ex "${PREFIX}(/Repos Explorer\.app/Contents/MacOS)?/service" "$RUNNER_TEMP/processes.txt" || { echo "::error title=GUI (macOS)::did not start the service beside it"; kill "$gui"; exit 1; }
          kill "$gui"
          for _ in $(seq 1 20); do kill -0 "$gui" 2>/dev/null || exit 0; sleep 0.5; done
          echo "::error title=GUI (macOS)::did not stop"; exit 1

      # The other way onto a Mac, and the one most readers take: mount the
      # disk image, drag `Repos Explorer.app` onto Applications, open it from
      # there. A scratch Applications rather than the machine's, because this
      # runner is not disposable in the way a container is.
      #
      # Everything above this tests loose executables put down by
      # install.sh. Nothing tested the bundle until here: that macOS reads
      # its property list, that LaunchServices accepts it as an application,
      # that opening it starts the service from `Contents/MacOS` beside it,
      # and that an update run inside it leaves the bundle's shape intact.
      - name: The disk image installs by dragging, and the bundle runs from Applications (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          fail() { echo "::error title=Disk image (macOS)::$*"; exit 1; }
          image="release/ReposExplorer.dmg"
          if [ "$FROM_ARTIFACTS" = true ]; then
            [ -f "$image" ] || fail "this run built no ReposExplorer.dmg"
          else
            version="$(tr -d '\r\n' < release/manifest.json | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
            gh release download "v${version}" --repo "${{ github.repository }}" \
              --pattern ReposExplorer.dmg --dir release || true
            if [ ! -f "$image" ]; then
              echo "::notice title=Disk image (macOS)::skipped: v${version} publishes no ReposExplorer.dmg. Needs a release cut since the bundle landed."
              exit 0
            fi
          fi

          mount="$RUNNER_TEMP/mounted-image"
          hdiutil attach "$image" -mountpoint "$mount" -nobrowse -readonly || fail "the disk image would not mount"
          ls -la "$mount"
          [ -d "$mount/Repos Explorer.app" ] || fail "the disk image holds no Repos Explorer.app"
          [ "$(readlink "$mount/Applications")" = /Applications ] \
            || fail "there is no /Applications shortcut beside the bundle to drag onto"

          applications="$RUNNER_TEMP/scratch-applications"
          rm -rf "$applications"
          mkdir -p "$applications"
          cp -R "$mount/Repos Explorer.app" "$applications/" || fail "the bundle would not copy out of the image"
          hdiutil detach "$mount" || hdiutil detach "$mount" -force
          app="$applications/Repos Explorer.app"

          # macOS's own readers, not ours: plutil parses the property list,
          # and LaunchServices is what Finder, the Dock and `open` ask.
          plutil -lint "$app/Contents/Info.plist" || fail "Info.plist is not a valid property list"
          for key in CFBundleIdentifier CFBundleName CFBundleDisplayName CFBundleExecutable \
                     CFBundleIconFile CFBundleVersion CFBundleShortVersionString \
                     LSMinimumSystemVersion NSHighResolutionCapable; do
            value="$(plutil -extract "$key" raw -o - "$app/Contents/Info.plist")" \
              || fail "Info.plist has no $key"
            echo "$key = $value"
          done
          [ -f "$app/Contents/Resources/AppIcon.icns" ] || fail "the bundle carries no icon"
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$lsregister" -f "$app" || fail "LaunchServices would not register the bundle"
          "$lsregister" -dump > "$RUNNER_TEMP/lsregister.txt"
          # The identifier rather than the path: it comes out of the property
          # list, so finding it proves LaunchServices read the bundle and
          # filed it as this application, whatever it made of the path.
          grep -n -F "io.github.stewartscottrogers.RepoSphereExplorer" "$RUNNER_TEMP/lsregister.txt" \
            > "$RUNNER_TEMP/registered.txt" \
            || fail "LaunchServices does not know the bundle's identifier after registering it"
          head -20 "$RUNNER_TEMP/registered.txt"
          # Spotlight has to have indexed the folder to answer; printed when
          # it does, and not made a gate when it does not.
          mdls -name kMDItemKind -name kMDItemDisplayName -name kMDItemVersion "$app" || true

          # A service left running by an earlier step would be reused rather
          # than replaced, and the bundle starting its own out of
          # Contents/MacOS is exactly what is being tested here.
          pkill -x service || true
          sleep 2
          "$app/Contents/MacOS/RepoSphereExplorerGui" "$RUNNER_TEMP/scratch" > "$RUNNER_TEMP/bundle-gui.log" 2>&1 &
          gui=$!
          sleep 10
          if ! kill -0 "$gui" 2>/dev/null; then cat "$RUNNER_TEMP/bundle-gui.log"; fail "the bundle's application exited after starting"; fi
          ps -A -o args= > "$RUNNER_TEMP/bundle-processes.txt"
          grep -Fx "$app/Contents/MacOS/service" "$RUNNER_TEMP/bundle-processes.txt" \
            || { kill "$gui"; fail "it did not start the service from Contents/MacOS"; }
          kill "$gui"
          for _ in $(seq 1 20); do kill -0 "$gui" 2>/dev/null || break; sleep 0.5; done

          # Self-update from inside the bundle: it replaces the executable
          # where it stands, so Contents/MacOS must still hold exactly the
          # three afterwards and no staging file beside them.
          output="$("$app/Contents/MacOS/RepoSphereExplorerTui" --self-update 2>&1)" \
            || { echo "$output"; fail "--self-update failed inside the bundle"; }
          echo "$output"
          case "$output" in *"tui is up to date"*) ;; *) fail "--self-update inside the bundle did not report up to date" ;; esac
          inside="$(ls -A "$app/Contents/MacOS" | sort | tr '\n' ' ')"
          [ "$inside" = "RepoSphereExplorerGui RepoSphereExplorerTui service " ] \
            || fail "Contents/MacOS holds '$inside' after the update"

          # Dragging it to the Bin is how a Mac user removes an application.
          # Its service outlives the window, as it does on every platform, so
          # it is stopped first - the later steps check what install.sh left,
          # and a process out of this scratch folder is not that.
          pkill -x service || true
          rm -rf "$app"
          [ ! -e "$app" ] || fail "the bundle would not delete"
          ls -la "$applications"

      # The terminal application has no flag that draws and exits, and a
      # runner has no terminal to draw in. --self-update is what it does
      # support without one: it starts, reads the signed manifest, and
      # exits, and against the release it was installed from it must say
      # it is up to date rather than reinstall.
      - name: Terminal application starts and exits (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & (Join-Path $env:PREFIX 'RepoSphereExplorerTui.exe') --self-update 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 0 -or $output -notmatch 'tui is up to date') { Write-Output "::error title=TUI (Windows)::--self-update did not report up to date"; exit 1 }
      - name: Terminal application starts and exits (${{ runner.os }})
        if: runner.os != 'Windows'
        shell: bash
        run: |
          output="$("$PREFIX/RepoSphereExplorerTui" --self-update 2>&1)" || { echo "$output"; echo "::error title=TUI (${RUNNER_OS})::--self-update failed"; exit 1; }
          echo "$output"
          case "$output" in *"tui is up to date"*) ;; *) echo "::error title=TUI (${RUNNER_OS})::--self-update did not report up to date"; exit 1 ;; esac

      # ---- the AppImage: the one file, run the way a reader runs it

      - name: Take this run's AppImage
        if: runner.os == 'Linux' && env.FROM_ARTIFACTS == 'true'
        uses: actions/download-artifact@v8
        with:
          name: appimage
          path: appimage
      - name: Download the published AppImage
        if: runner.os == 'Linux' && env.FROM_ARTIFACTS != 'true'
        shell: bash
        run: |
          mkdir -p appimage
          version="$(tr -d '\r\n' < release/manifest.json | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
          gh release download "v${version}" --repo "${{ github.repository }}" \
            --pattern "ReposExplorer-x86_64.AppImage" --dir appimage \
            || echo "::notice title=AppImage (Linux)::skipped: v${version} publishes no AppImage. Needs a release cut since this workflow."

      # No install step at all: made executable, and run. The runtime mounts
      # the file, so the three binaries inside it sit beside each other
      # exactly as an install puts them and the graphical application starts
      # the service next to itself.
      - name: The AppImage runs with no install at all (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          image="$PWD/appimage/ReposExplorer-x86_64.AppImage"
          if [ ! -f "$image" ]; then
            echo "::notice title=AppImage (Linux)::skipped: no AppImage to run"; exit 0
          fi
          chmod +x "$image"
          ls -la "$image"
          export IMAGE="$image"
          cat > "$RUNNER_TEMP/appimage-check.sh" <<'CHECK'
          set -uo pipefail
          # The installed application's checks leave its service running,
          # which is what a service is for. The AppImage would find it and
          # use it rather than start the one it carries - correctly - and
          # this check is about the one it carries. So nothing may be
          # listening first.
          pkill -x service || true
          for _ in $(seq 1 20); do pgrep -x service > /dev/null || break; sleep 0.5; done
          if pgrep -x service > /dev/null; then
            echo "::error title=AppImage (Linux)::a service from an earlier step would not stop"; exit 1
          fi
          "$IMAGE" "$RUNNER_TEMP/scratch" > "$RUNNER_TEMP/appimage.log" 2>&1 &
          app=$!
          sleep 12
          if ! kill -0 "$app" 2>/dev/null; then
            cat "$RUNNER_TEMP/appimage.log"
            echo "::error title=AppImage (Linux)::exited after starting"; exit 1
          fi
          xwininfo -root -tree | grep -F '"Repos Explorer"' \
            || { echo "::error title=AppImage (Linux)::no Repos Explorer window"; kill "$app"; exit 1; }
          ps -A -o args= > "$RUNNER_TEMP/appimage-processes.txt"
          # Its own service, from inside the mounted image, not one left
          # running by an earlier step or by an install.
          grep -E '^/tmp/\.mount_[^/]*/usr/bin/service$' "$RUNNER_TEMP/appimage-processes.txt" \
            || { cat "$RUNNER_TEMP/appimage-processes.txt"; echo "::error title=AppImage (Linux)::did not start the service it carries"; kill "$app"; exit 1; }
          kill "$app"
          for _ in $(seq 1 20); do kill -0 "$app" 2>/dev/null || exit 0; sleep 0.5; done
          echo "::error title=AppImage (Linux)::did not stop"; exit 1
          CHECK
          if pgrep -f '/usr/bin/service$'; then
            echo "::error title=AppImage (Linux)::a service from a mounted image was already running"; exit 1
          fi
          xvfb-run -a -s "-screen 0 1280x800x24" bash "$RUNNER_TEMP/appimage-check.sh"

      # Self-update inside an AppImage is not possible in place, so it has to
      # say so plainly rather than fail on a read-only file.
      - name: The AppImage says how an AppImage updates (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          image="$PWD/appimage/ReposExplorer-x86_64.AppImage"
          if [ ! -f "$image" ]; then
            echo "::notice title=AppImage self-update (Linux)::skipped: no AppImage to run"; exit 0
          fi
          output="$("$image" --self-update 2>&1)" \
            || { echo "$output"; echo "::error title=AppImage self-update (Linux)::--self-update failed"; exit 1; }
          echo "$output"
          for said in "cannot update itself in place" "ReposExplorer-x86_64.AppImage" "releases"; do
            case "$output" in
              *"$said"*) ;;
              *) echo "::error title=AppImage self-update (Linux)::it never said \"$said\""; exit 1 ;;
            esac
          done

      # ---- self-update: the previous release, updated to the latest

      - name: Self-update from the previous release (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $latest = (Invoke-RestMethod $env:LATEST_MANIFEST_URL).version
          $tags = @(gh release list --repo "${{ github.repository }}" --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')
          $index = [Array]::IndexOf($tags, "v$latest")
          if ($index -lt 0 -or $index + 1 -ge $tags.Count) { Write-Output "::notice title=Self-update (Windows)::skipped: no release before v$latest"; exit 0 }
          $previous = $tags[$index + 1]
          $assets = @(gh release view $previous --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          if ($assets -notcontains 'manifest.json') { Write-Output "::notice title=Self-update (Windows)::skipped: $previous carries no signed manifest.json, so it cannot be installed with verification. Needs two releases cut since distribution.yml."; exit 0 }
          # A second copy beside the real one: its Start menu shortcut and
          # Apps entry go somewhere harmless, so installing and removing it
          # does not take the real install's away.
          $prefix = Join-Path $env:RUNNER_TEMP 'previous'
          $menu = Join-Path $env:RUNNER_TEMP 'previous-start-menu'
          $key = 'HKCU:\Software\RepoSphereExplorerDistributionCheck\Uninstall\ReposExplorer'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Tag $previous -Prefix $prefix `
            -StartMenuDirectory $menu -UninstallRegistryKey $key
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Self-update (Windows)::could not install $previous"; exit 1 }
          $from = $previous.TrimStart('v')
          foreach ($pair in @(@('service', 'service'), @('RepoSphereExplorerTui', 'tui'), @('RepoSphereExplorerGui', 'gui'))) {
            $exe = Join-Path $prefix "$($pair[0]).exe"
            $first = & $exe --self-update 2>&1 | Out-String
            Write-Output $first
            if ($first -notmatch [regex]::Escape("$($pair[1]) updated: v$from -> v$latest")) { Write-Output "::error title=Self-update (Windows)::$($pair[0]) did not update v$from -> v$latest"; exit 1 }
            $second = & $exe --self-update 2>&1 | Out-String
            Write-Output $second
            if ($second -notmatch [regex]::Escape("$($pair[1]) is up to date (v$latest)")) { Write-Output "::error title=Self-update (Windows)::$($pair[0]) did not report up to date on a second run"; exit 1 }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Uninstall -Prefix $prefix
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Self-update from the previous release (${{ runner.os }})
        if: runner.os != 'Windows'
        shell: bash
        run: |
          latest="$(curl -fsSL "$LATEST_MANIFEST_URL" | tr -d '\r\n' | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
          previous="$(gh release list --repo "${{ github.repository }}" --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' \
            | awk -v tag="v$latest" 'found { print; exit } $0 == tag { found = 1 }')"
          if [ -z "$previous" ]; then echo "::notice title=Self-update (${RUNNER_OS})::skipped: no release before v$latest"; exit 0; fi
          if ! gh release view "$previous" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx manifest.json; then
            echo "::notice title=Self-update (${RUNNER_OS})::skipped: $previous carries no signed manifest.json, so it cannot be installed with verification. Needs two releases cut since distribution.yml."
            exit 0
          fi
          prefix="$RUNNER_TEMP/previous"
          bin_args=()
          # A second copy beside the real one: its desktop entry and themed
          # icon go somewhere harmless, so installing and removing it does
          # not take the real install's menu entry away.
          [ "$RUNNER_OS" != Linux ] || bin_args=(--bin-dir "$RUNNER_TEMP/previous-bin" --xdg-data-dir "$RUNNER_TEMP/previous-share")
          scripts/install.sh --tag "$previous" --prefix "$prefix" "${bin_args[@]}" \
            || { echo "::error title=Self-update (${RUNNER_OS})::could not install $previous"; exit 1; }
          from="${previous#v}"
          for pair in service:service RepoSphereExplorerTui:tui RepoSphereExplorerGui:gui; do
            binary="${pair%%:*}"; label="${pair##*:}"
            first="$("$prefix/$binary" --self-update 2>&1)" || true
            echo "$first"
            case "$first" in *"$label updated: v$from -> v$latest"*) ;; *) echo "::error title=Self-update (${RUNNER_OS})::$binary did not update v$from -> v$latest"; exit 1 ;; esac
            second="$("$prefix/$binary" --self-update 2>&1)" || true
            echo "$second"
            case "$second" in *"$label is up to date (v$latest)"*) ;; *) echo "::error title=Self-update (${RUNNER_OS})::$binary did not report up to date on a second run"; exit 1 ;; esac
          done
          scripts/install.sh --uninstall --prefix "$prefix"

      # ---- uninstall

      - name: Purge refuses without confirmation on a machine that is not disposable (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:CI = $null
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Uninstall -Purge
          if ($LASTEXITCODE -eq 0 -or -not (Test-Path (Join-Path $env:PREFIX 'installed-files.txt'))) {
            Write-Output "::error title=Purge refusal (Windows)::-Purge ran without -Yes and without CI=true"; exit 1
          }
          exit 0
      - name: Purge refuses without confirmation on a machine that is not disposable (${{ runner.os }})
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if env -u CI scripts/install.sh --uninstall --purge; then
            echo "::error title=Purge refusal (${RUNNER_OS})::--purge ran without --yes and without CI=true"; exit 1
          fi
          [ -f "$PREFIX/installed-files.txt" ] || { echo "::error title=Purge refusal (${RUNNER_OS})::the refused purge removed files"; exit 1; }

      - name: Uninstall with purge leaves nothing behind (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Uninstall while the application is open, which is how somebody
          # actually removes it. Windows keeps an executable locked for a
          # moment after its process ends, and an uninstall that deleted
          # straight away failed with "access to the path is denied".
          $gui = Start-Process -FilePath (Join-Path $env:PREFIX 'RepoSphereExplorerGui.exe') -ArgumentList "`"$env:RUNNER_TEMP\scratch`"" -PassThru
          Start-Sleep -Seconds 5
          # Remove it the way Settings > Apps does: run the UninstallString
          # the install wrote, through the command processor, which also
          # proves that string works. -Purge is this check's addition; the
          # button itself keeps the journal and the configuration.
          $uninstall = (Get-ItemProperty -LiteralPath $env:UNINSTALL_KEY).UninstallString
          Write-Output "UninstallString: $uninstall"
          $command = Join-Path $env:RUNNER_TEMP 'uninstall.cmd'
          Set-Content -LiteralPath $command -Value "$uninstall -Purge" -Encoding ASCII
          & $env:ComSpec /c $command
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=Uninstall (Windows)::the UninstallString failed"; exit 1 }
          Write-Output "--- $env:LOCALAPPDATA"; Get-ChildItem -Force $env:LOCALAPPDATA | Format-Table -AutoSize | Out-String -Width 200
          Write-Output "--- $env:LOCALAPPDATA\Programs"; Get-ChildItem -Force (Join-Path $env:LOCALAPPDATA 'Programs') -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String -Width 200
          $failed = $false
          if (Test-Path $env:PREFIX) { Write-Output "::error title=Uninstall (Windows)::$env:PREFIX remains"; $failed = $true }
          if (Test-Path $env:DATA_DIR) { Write-Output "::error title=Uninstall (Windows)::$env:DATA_DIR remains"; $failed = $true }
          if (Test-Path -LiteralPath $env:SHORTCUT) { Write-Output "::error title=Uninstall (Windows)::$env:SHORTCUT remains"; $failed = $true }
          if (Test-Path -LiteralPath $env:UNINSTALL_KEY) { Write-Output "::error title=Uninstall (Windows)::$env:UNINSTALL_KEY remains"; $failed = $true }
          # Nothing left to remove, so the second time it says so and stops.
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Uninstall
          if ($LASTEXITCODE -eq 0) { Write-Output "::error title=Uninstall (Windows)::a second uninstall was not refused"; $failed = $true }
          $left = @(Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($env:PREFIX, [StringComparison]::OrdinalIgnoreCase) })
          $left | Format-Table Id, Path -AutoSize | Out-String -Width 200
          if ($left.Count -gt 0) { Write-Output "::error title=Uninstall (Windows)::processes from the install remain"; $failed = $true }
          if ($failed) { exit 1 }
          # The refused second uninstall left $LASTEXITCODE at 1, and the
          # runner ends a PowerShell step with that code unless told otherwise.
          exit 0
      - name: Uninstall with purge leaves nothing behind (${{ runner.os }})
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scripts/install.sh --uninstall --purge \
            || { echo "::error title=Uninstall (${RUNNER_OS})::install.sh --uninstall --purge failed"; exit 1; }
          failed=""
          echo "--- $(dirname "$PREFIX")"; ls -la "$(dirname "$PREFIX")"
          echo "--- $(dirname "$DATA_DIR")"; ls -la "$(dirname "$DATA_DIR")"
          [ ! -e "$PREFIX" ] || { echo "::error title=Uninstall (${RUNNER_OS})::$PREFIX remains"; failed=1; }
          [ ! -e "$DATA_DIR" ] || { echo "::error title=Uninstall (${RUNNER_OS})::$DATA_DIR remains"; failed=1; }
          if [ "$RUNNER_OS" = Linux ]; then
            echo "--- $BIN_DIR"; ls -la "$BIN_DIR" || true
            for name in RepoSphereExplorerGui RepoSphereExplorerTui; do
              if [ -e "$BIN_DIR/$name" ] || [ -L "$BIN_DIR/$name" ]; then
                echo "::error title=Uninstall (Linux)::$BIN_DIR/$name remains"; failed=1
              fi
            done
          fi
          ps -A -o pid= -o args= > "$RUNNER_TEMP/processes-after.txt"
          if grep -F "$PREFIX/" "$RUNNER_TEMP/processes-after.txt"; then
            echo "::error title=Uninstall (${RUNNER_OS})::processes from the install remain"; failed=1
          fi
          [ -z "$failed" ]

      # Uninstall removes exactly what install made, which includes the
      # things the desktop was told about. An application left in the
      # applications menu after it is gone is a menu entry that does nothing.
      - name: The desktop entry and the themed icon are gone (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          failed=""
          entry="$HOME/.local/share/applications/reposphereexplorer.desktop"
          icons="$HOME/.local/share/icons/hicolor"
          echo "--- $(dirname "$entry")"; ls -la "$(dirname "$entry")" || true
          echo "--- $icons"; find "$icons" || true
          [ ! -e "$entry" ] || { echo "::error title=Uninstall (Linux)::$entry remains"; failed=1; }
          left="$(find "$icons" -name 'reposphereexplorer.*' 2>/dev/null || true)"
          if [ -n "$left" ]; then
            echo "$left"
            echo "::error title=Uninstall (Linux)::themed icons remain"; failed=1
          fi
          [ -z "$failed" ]
