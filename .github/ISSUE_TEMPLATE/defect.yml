name: Defect
description: Something built by the factory behaves incorrectly.
title: "[defect] "
labels: [defect]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact commands and inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
