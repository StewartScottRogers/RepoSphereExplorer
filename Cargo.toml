[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/protocol",
    "crates/plugin-api",
    "crates/service",
    "crates/tui",
    "crates/gui",
    "crates/plugins/*",
    "crates/updater",
]
# The sample projects under `samples/` are fixtures to open, not crates to
# build here. Excluded so cargo does not try to make members of them, and
# so a person running cargo inside one gets that project rather than this
# workspace.
exclude = [
    "samples/project-cargo",
    "samples/rust",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/StewartScottRogers/RepoSphereExplorer"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = true
codegen-units = 1
