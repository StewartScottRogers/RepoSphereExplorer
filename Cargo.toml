[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/protocol",
    "crates/plugin-api",
    "crates/service",
    "crates/tui",
    "crates/gui",
    "crates/plugins/text",
    "crates/plugins/image",
    "crates/plugins/archive",
    "crates/plugins/pdf",
    "crates/plugins/directory",
    "crates/updater",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/StewartScottRogers/RepoSphereExplorer"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
strip = true
lto = true
codegen-units = 1
