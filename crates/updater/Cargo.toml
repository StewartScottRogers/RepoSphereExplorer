[package]
name = "updater"
description = "In-app updater: fetches, signature-verifies, and atomically applies release binaries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[lints]
workspace = true
