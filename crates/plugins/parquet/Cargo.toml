[package]
name = "plugin-parquet"
description = "Parquet file type plugin: core and presentation halves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
plugin-api = { path = "../../plugin-api" }
parquet = { version = "59", default-features = false, features = ["snap", "flate2-zlib-rs", "lz4", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
