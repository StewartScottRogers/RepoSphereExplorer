[package]
name = "plugin-directory"
description = "Directory-as-file type plugin: core and presentation halves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Settling whether a tracked file whose timestamp moved actually changed:
# the index stores each blob's SHA-1, so comparing means computing one.
sha1 = "0.10"
plugin-api = { path = "../../plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
