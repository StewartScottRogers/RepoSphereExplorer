[package]
name = "plugin-package-archive"
description = "OS package file type plugin: core and presentation halves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
plugin-api = { path = "../../plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ar = "0.9"
tar = "0.4"
flate2 = "1"
lzma-rs = "0.3"
rpm = { version = "0.27", default-features = false }

[dev-dependencies]
rpm = { version = "0.27", default-features = false, features = [
    "payload",
    "gzip-compression",
] }

[lints]
workspace = true
