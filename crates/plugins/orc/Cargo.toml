[package]
name = "plugin-orc"
description = "Apache ORC file type plugin: core and presentation halves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
plugin-api = { path = "../../plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same arrow 59 the Parquet and Arrow plugins already pull in, and
# the one orc-rust itself is built against.
arrow = { version = "59", default-features = false, features = ["prettyprint"] }
orc-rust = "0.9"

[lints]
workspace = true
