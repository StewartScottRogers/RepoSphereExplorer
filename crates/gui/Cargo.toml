[package]
name = "gui"
description = "Slint front end: renders state and sends intents to the service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "RepoSphereExplorerGui"
path = "src/main.rs"

