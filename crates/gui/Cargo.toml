[package]
name = "gui"
description = "Slint front end: renders state and sends intents to the service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
interprocess = "2.4"
plugin-api = { path = "../plugin-api" }
plugin-archive = { path = "../plugins/archive" }
plugin-c = { path = "../plugins/c" }
plugin-clojure = { path = "../plugins/clojure" }
plugin-cpp = { path = "../plugins/cpp" }
plugin-csharp = { path = "../plugins/csharp" }
plugin-dart = { path = "../plugins/dart" }
plugin-directory = { path = "../plugins/directory" }
plugin-elixir = { path = "../plugins/elixir" }
plugin-erlang = { path = "../plugins/erlang" }
plugin-fortran = { path = "../plugins/fortran" }
plugin-go = { path = "../plugins/go" }
plugin-image = { path = "../plugins/image" }
plugin-java = { path = "../plugins/java" }
plugin-javascript = { path = "../plugins/javascript" }
plugin-julia = { path = "../plugins/julia" }
plugin-kotlin = { path = "../plugins/kotlin" }
plugin-objective-c = { path = "../plugins/objective-c" }
plugin-pdf = { path = "../plugins/pdf" }
plugin-perl = { path = "../plugins/perl" }
plugin-php = { path = "../plugins/php" }
plugin-powershell = { path = "../plugins/powershell" }
plugin-python = { path = "../plugins/python" }
plugin-r = { path = "../plugins/r" }
plugin-haskell = { path = "../plugins/haskell" }
plugin-ruby = { path = "../plugins/ruby" }
plugin-rust = { path = "../plugins/rust" }
plugin-scala = { path = "../plugins/scala" }
plugin-shell = { path = "../plugins/shell" }
plugin-sql = { path = "../plugins/sql" }
plugin-swift = { path = "../plugins/swift" }
plugin-text = { path = "../plugins/text" }
plugin-typescript = { path = "../plugins/typescript" }
protocol = { path = "../protocol" }
serde_json = "1"
slint = "1.17"
updater = { path = "../updater" }

[build-dependencies]
slint-build = "1.17"

# Not `[lints] workspace = true`: Slint's generated component code (from
# build.rs, included into this crate) contains its own #[allow(unsafe_code)]
# for FFI vtable plumbing. A crate-level `forbid` rejects that even though
# we never write unsafe code ourselves here, so this crate alone runs with
# `deny` instead - still blocking any unsafe code *we* add, just not
# Slint's own internal allow.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
