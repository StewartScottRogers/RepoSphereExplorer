serde_json = "1"
# `unstable-winit-030` for the window-geometry work order (#583): reaching
# the connected displays' bounds, to tell whether a remembered window
# position is still on one of them, has no path through Slint's own
# cross-platform `Window` - only through the winit window underneath it.
slint = { version = "1.17", features = ["unstable-winit-030"] }
updater = { path = "../updater" }

[build-dependencies]
slint-build = "1.17"

# Compiles `assets/RepoSphereExplorer.ico` into the binary's resource
# directory. Conditional on the host, because a build script runs on the host
# and only a Windows one has the resource compiler this drives.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Slint's own UI-testing backend: simulates a windowing system so a test can
# dispatch pointer events through Slint's hit-testing without a display. It
# deliberately does not follow semver, so it is pinned with `=` to the exact
# Slint version, as its README requires.
[dev-dependencies]
i-slint-backend-testing = "=1.17.1"
# Test-only: the sweep over `samples/` needs the core halves to produce the
# view data the presentation halves then render.
service = { path = "../service" }
# Test-only: reads the icon resource back out of the built binary.
icon = { path = "../icon" }

# Not `[lints] workspace = true`: Slint's generated component code (from
# build.rs, included into this crate) contains its own #[allow(unsafe_code)]
# for FFI vtable plumbing. A crate-level `forbid` rejects that even though
# we never write unsafe code ourselves here, so this crate alone runs with
# `deny` instead - still blocking any unsafe code *we* add, just not
# Slint's own internal allow.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
