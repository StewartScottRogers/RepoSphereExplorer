[package]
name = "plugin-api"
description = "The core and presentation plugin traits, and the registration macro."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# For `thumbnail`, which five plugins now share: scaling a picture down to
# something a preview pane can draw, and carrying it over the wire.
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
serde_json = "1"

[lints]
workspace = true
